# Configuração do ambiente de build do DartForge.
#
# `llvm-sys` localiza o LLVM pela variável LLVM_SYS_<versão>_PREFIX. Defini-la
# aqui evita exportá-la em cada terminal e mantém o caminho versionado junto do
# código: um colaborador que clone o repositório vê de imediato qual
# distribuição é esperada.
#
# A distribuição precisa ser a completa — `clang+llvm-...-windows-msvc`, com
# llvm-config, cabeçalhos llvm-c/** e bibliotecas estáticas. O instalador
# reduzido `LLVM-...-win64.exe` traz apenas clang e LLVM-C.dll, sem llvm-config,
# e não serve para o llvm-sys.
#
# `relative = false` não existe para [env]; o caminho é absoluto de propósito.
# Quem instalar o LLVM em outro lugar sobrescreve a variável no próprio ambiente,
# que tem precedência sobre esta seção.
[env]
LLVM_SYS_221_PREFIX = "D:/DartSDKs/llvm/clang+llvm-22.1.8-x86_64-pc-windows-msvc"

# `target/` compartilhado por todas as worktrees (agentes trabalham em
# D:/Projects/dartforge-*/ e .claude/worktrees/*): a máquina tem 8 GB de RAM e
# quatro árvores compilando o mesmo workspace em paralelo, cada uma com o seu
# `target/`, é o que a deixa em disco. Com um diretório só, os builds se
# enfileiram na trava do Cargo e nada é compilado mais de uma vez.
# `jobs` limita o rustc em paralelo pelo mesmo motivo (8 núcleos, 8 GB).
[build]
target-dir = "D:/Projects/dartforge/target"
jobs = 6
