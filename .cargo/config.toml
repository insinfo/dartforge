# Toolchain installations belong in the caller's environment, not in a shared
# absolute path. Select LLVM with DARTFORGE_LLVM_DIR / LLVM_SYS_221_PREFIX or
# expose a complete LLVM 22.1 installation's llvm-config on PATH.

# Limit concurrent rustc processes on development machines. Each checkout keeps
# its own target directory so artifacts from different source trees cannot be
# mistaken for the current compiler.
[build]
jobs = 6

# LLVM's static archives can contain bitcode newer than Apple's libLTO.
# The wrapper leaves ordinary links and explicit linker choices alone.
[target.'cfg(target_os = "macos")']
linker = "scripts/rust-linker-macos.sh"
