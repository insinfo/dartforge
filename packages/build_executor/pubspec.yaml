name: dartforge_build_executor
version: 0.1.0-dev.0
description: >-
  Dart side of the build.* service of dfexec/1 (docs/BUILD-PROTOCOLO.md): runs
  package:build builders with a BuildStep whose reads and writes go through
  DartForge's build engine. It is not resolved by `pub get`: the engine adds it
  to the project's package_config.json, which already has build,
  build_resolvers and their dependencies (the project uses build_runner).
publish_to: none

environment:
  sdk: ^3.6.0

dependencies:
  analyzer: '>=6.9.0 <8.0.0'
  build: ^2.4.2
  build_resolvers: ^2.4.4
  glob: ^2.1.0
  logging: ^1.2.0
  package_config: ^2.1.0
