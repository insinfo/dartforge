# Discovery is an intermediate step: only projects that explicitly enable it
# get the manifest. Emitting .macro.dart will be enabled after byte-for-byte
# parity with the CFE.
builders:
  macroDiscovery:
    import: "package:dartforge_macros_builder/macros_builder.dart"
    builder_factories: ["macroDiscoveryBuilder"]
    build_extensions: {".dart": [".macro_uses.json"]}
    auto_apply: none
    build_to: source
