name: macros
# The surface is that of package:macros 0.1.3-main.0 (which re-exports the
# 3.6.2 SDK's `_macros` 0.3.3): macro code written for it, like
# package:json 0.20.4's `@JsonCodable`, compiles unchanged against this one.
version: 0.1.3-main.0
description: >-
  DartForge's macro API, rewritten from the specification
  (dart-language/working/macros) with the same surface as package:macros
  0.1.3-main.0, and the executor side (introspection over the model the host
  sends, result builders and the macro.* service of dfexec/1).
publish_to: none

environment:
  sdk: ^3.6.0

dev_dependencies:
  json: 0.20.4
