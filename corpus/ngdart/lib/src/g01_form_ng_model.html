<form (ngSubmit)="salvar()" class="f">
  <input type="text" [(ngModel)]="nome" [disabled]="bloqueado" [required]="!bloqueado">
  <textarea [(ngModel)]="texto" rows="3" required></textarea>
  <div *ngIf="mostra">
    <input type="password" [(ngModel)]="senha">
  </div>
  <button type="submit">ok</button>
</form>
