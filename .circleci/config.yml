# CircleCI: one pipeline per commit, the crate groups in parallel jobs.
# The same groups as .gitlab-ci.yml (analyzer and LSP, in release); Windows,
# which is the target, stays in .github/workflows/ci.yml. Rust comes from
# rust-toolchain.toml (the image's rustup installs 1.98.1). sccache
# (mozilla/sccache) keeps each crate's compilation between pipelines.
version: 2.1

executors:
  rust:
    docker:
      - image: cimg/rust:1.86
    resource_class: large
    environment:
      CARGO_INCREMENTAL: '0'
      CARGO_TERM_COLOR: always
      SCCACHE_DIR: /home/circleci/.sccache
      SCCACHE_CACHE_SIZE: 4G

commands:
  prepare:
    steps:
      - checkout
      - run:
          name: Dart SDK 3.6.2
          command: |
            curl -sSfL -o /tmp/dart.zip https://storage.googleapis.com/dart-archive/channels/stable/release/3.6.2/sdk/dartsdk-linux-x64-release.zip
            sudo unzip -q /tmp/dart.zip -d /opt
            echo 'export PATH="/opt/dart-sdk/bin:$PATH"' >> "$BASH_ENV"
            echo 'export DARTFORGE_DART_SDK=/opt/dart-sdk DART_SDK=/opt/dart-sdk DARTFORGE_SDK_LIB=/opt/dart-sdk/lib' >> "$BASH_ENV"
      - run:
          name: sccache
          command: |
            curl -sSfL https://github.com/mozilla/sccache/releases/download/v0.18.0/sccache-v0.18.0-x86_64-unknown-linux-musl.tar.gz | tar xz -C /tmp
            sudo install /tmp/sccache-v0.18.0-x86_64-unknown-linux-musl/sccache /usr/local/bin/sccache
            echo 'export RUSTC_WRAPPER=/usr/local/bin/sccache' >> "$BASH_ENV"
      - run:
          name: Pinned Rust
          command: rustup show active-toolchain || rustup toolchain install 1.98.1 --profile minimal
      - restore_cache:
          keys:
            - cargo-{{ .Environment.CIRCLE_JOB }}-{{ checksum "Cargo.lock" }}
            - cargo-{{ .Environment.CIRCLE_JOB }}-

  save:
    steps:
      - run:
          name: sccache statistics
          when: always
          command: sccache --show-stats || true
      - save_cache:
          key: cargo-{{ .Environment.CIRCLE_JOB }}-{{ checksum "Cargo.lock" }}-{{ .Revision }}
          paths:
            - ~/.cargo/registry
            - ~/.sccache

jobs:
  messages:
    docker:
      - image: cimg/base:stable
    resource_class: small
    steps:
      - checkout
      - run: sh scripts/no-ai-trailer.sh --history HEAD

  analyzer:
    executor: rust
    steps:
      - prepare
      - run:
          name: analyzer tests
          no_output_timeout: 60m
          command: >-
            cargo test --locked --release --no-fail-fast
            -p dartforge-frontend -p dartforge-types -p dartforge-analysis
            -p dartforge-diagnostics -p dartforge-parity
      - save

  lsp:
    executor: rust
    steps:
      - prepare
      - run:
          name: LSP tests
          no_output_timeout: 60m
          command: cargo test --locked --release --no-fail-fast -p dartforge-lsp
      - save

workflows:
  tests:
    jobs:
      - messages
      - analyzer
      - lsp
