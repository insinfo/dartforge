# GitLab CI: one pipeline per commit, the crate groups in parallel jobs.
# Complements .github/workflows/ci.yml (Windows, the target); here it is
# Linux, on GitLab.com's shared runners.
#
# * No job is `interruptible` and the project has auto-cancellation off: each
#   commit is tested to the end, even with newer commits on the same branch.
# * The crate groups follow the local gate: the analyzer (frontend, types,
#   analysis, diagnostics, parity) and the LSP, in release. The whole
#   workspace stays in the manual `rest` job: ci.yml records known failures on
#   Linux (dartforge-dev, emit-js, elements sdk_cache).
# * Rust comes from rust-toolchain.toml (the image's rustup installs 1.98.1).
# * sccache (mozilla/sccache) keeps each crate's compilation between
#   pipelines, in the job cache; smaller than keeping the whole target/.

default:
  image: rust:bookworm
  interruptible: false

variables:
  CARGO_HOME: $CI_PROJECT_DIR/.cargo-home
  CARGO_INCREMENTAL: '0'
  CARGO_TERM_COLOR: always
  DART_VERSION: '3.6.2'
  SCCACHE_VERSION: 'v0.18.0'
  SCCACHE_DIR: $CI_PROJECT_DIR/.sccache
  SCCACHE_CACHE_SIZE: 4G

stages:
  - test

.dart_and_cache:
  cache:
    key: $CI_JOB_NAME
    paths:
      - .cargo-home/registry/index/
      - .cargo-home/registry/cache/
      - .sccache/
  before_script:
    - apt-get update -qq && apt-get install -y -qq unzip > /dev/null
    - curl -sSfL -o /tmp/dart.zip "https://storage.googleapis.com/dart-archive/channels/stable/release/${DART_VERSION}/sdk/dartsdk-linux-x64-release.zip"
    - unzip -q /tmp/dart.zip -d /opt
    - export PATH="/opt/dart-sdk/bin:$PATH"
    - export DARTFORGE_DART_SDK=/opt/dart-sdk DART_SDK=/opt/dart-sdk DARTFORGE_SDK_LIB=/opt/dart-sdk/lib
    - dart --version
    - curl -sSfL "https://github.com/mozilla/sccache/releases/download/${SCCACHE_VERSION}/sccache-${SCCACHE_VERSION}-x86_64-unknown-linux-musl.tar.gz" | tar xz -C /tmp
    - install /tmp/sccache-${SCCACHE_VERSION}-x86_64-unknown-linux-musl/sccache /usr/local/bin/sccache
    - export RUSTC_WRAPPER=/usr/local/bin/sccache
    - rustc --version
  after_script:
    - /usr/local/bin/sccache --show-stats || true

messages:
  stage: test
  image: alpine:3.20
  before_script:
    - apk add --no-cache git > /dev/null
  script:
    - git fetch --unshallow 2>/dev/null || true
    - sh scripts/no-ai-trailer.sh --history HEAD

analyzer:
  stage: test
  extends: .dart_and_cache
  timeout: 90m
  script:
    - >-
      cargo test --locked --release --no-fail-fast
      -p dartforge-frontend -p dartforge-types -p dartforge-analysis
      -p dartforge-diagnostics -p dartforge-parity

lsp:
  stage: test
  extends: .dart_and_cache
  timeout: 90m
  script:
    - cargo test --locked --release --no-fail-fast -p dartforge-lsp

rest:
  stage: test
  extends: .dart_and_cache
  timeout: 3h
  when: manual
  allow_failure: true
  script:
    - cargo test --locked --workspace --no-fail-fast
