[workspace]
members = ["crates/*"]
resolver = "3"
[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
[workspace.lints.rust]
# `unsafe` é permitido onde for inevitável — FFI com a API C do LLVM, alocador
# contador — ou onde uma medição comprovar ganho. `deny` em vez de `allow` para
# que cada uso seja deliberado e rastreável: um `#[allow(unsafe_code)]` aparece
# no diff e no grep, um `allow` global não apareceria em lugar nenhum.
# Todo bloco `unsafe` documenta, em português, a invariante que preserva.
unsafe_code = "deny"
# Dentro de uma `unsafe fn`, cada operação insegura ainda exige bloco explícito.
unsafe_op_in_unsafe_fn = "deny"
[profile.release]
lto = "thin"
codegen-units = 1

# O runtime nativo precisa ter a MESMA semântica em qualquer perfil: o AOT o
# compila com `rustc -O` (crates/emit_native/src/cache.rs), isto é, opt-level 2,
# sem debug-assertions e sem overflow-checks. Com os padrões de `dev`/`test`,
# a mesma fonte entraria em `panic` por estouro onde o executável AOT faz
# aritmética modular, e o JIT divergiria do AOT. `dartforge-jit` entra aqui
# porque, até a fonte única do runtime (plano do JIT, §3.1), é nele que
# `runtime_main.rs` é compilado.
[profile.dev.package.dartforge-runtime]
opt-level = 2
debug-assertions = false
overflow-checks = false
[profile.dev.package.dartforge-jit]
opt-level = 2
debug-assertions = false
overflow-checks = false
[profile.release.package.dartforge-runtime]
opt-level = 2
[profile.release.package.dartforge-jit]
opt-level = 2
[profile.bench]
debug = true
