[package]
name = "dartforge-runtime-static"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

# The runtime `staticlib` the AOT links into executables: the `abi` module of
# `dartforge-runtime` in the `aot` profile (with the C `main`) or `dll` (the
# shared library of the source SDK), with its dependencies (the TLS of
# `dart:io`) inside the same file — a single copy of the Rust standard
# library. Compiled by the `build.rs` of `crates/emit_native` (its own
# `cargo build`, with its own target and directory), never on the machine of whoever uses
# dartforge.
[lib]
crate-type = ["staticlib"]
test = false
doctest = false

[features]
aot = ["dartforge-runtime/aot"]
dll = ["dartforge-runtime/dll"]

[dependencies]
dartforge-runtime = { path = "../runtime" }
