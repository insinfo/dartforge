[package]
name = "dartforge-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
[lints]
workspace = true
[dependencies]
dartforge-abi = { path = "../abi", optional = true }
dartforge-native = { path = "../native", optional = true }
# dartforge-jit = { path = "../jit", optional = true }
dartforge-emit-native = { path = "../emit_native", optional = true }
dartforge-compiler = { path = "../compiler" }
dartforge-packages = { path = "../packages" }
dartforge-emit-js = { path = "../emit_js" }
serde_json = "1"

[features]
# Backend nativo (AOT LLVM, ABI, emit-native). JIT ORCv2 desabilitado a pedido do usuário.
nativo = ["dep:dartforge-abi", "dep:dartforge-native", "dep:dartforge-emit-native"]

[[bin]]
name = "dartforge"
path = "src/main.rs"
