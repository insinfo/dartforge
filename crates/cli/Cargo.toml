[package]
name = "dartforge-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
[lints]
workspace = true
[dependencies]
dartforge-abi = { path = "../abi", optional = true }
dartforge-native = { path = "../native", optional = true }
dartforge-jit = { path = "../jit", optional = true }
dartforge-compiler = { path = "../compiler" }
dartforge-packages = { path = "../packages" }
dartforge-emit-js = { path = "../emit_js" }
dartforge-dev = { path = "../dev" }
serde_json = "1"

[features]
# Backend nativo (JIT ORCv2 via llvm-sys, AOT, ABI). Desligado por padrão:
# o caminho JavaScript não precisa do LLVM nem paga o build do llvm-sys.
nativo = ["dep:dartforge-abi", "dep:dartforge-native", "dep:dartforge-jit"]

[[bin]]
name = "dartforge"
path = "src/main.rs"
