[package]
name = "dartforge-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
[lints]
workspace = true
[dependencies]
dartforge-abi = { path = "../abi", optional = true }
dartforge-emit-native = { path = "../emit_native", optional = true }
dartforge-jit = { path = "../jit", optional = true }
dartforge-emit-js = { path = "../emit_js" }
dartforge-dev = { path = "../dev" }
dartforge-build = { path = "../build" }
dartforge-elements = { path = "../elements" }
dartforge-intern = { path = "../intern" }
dartforge-macros-host = { path = "../macros_host" }
dartforge-paridade = { path = "../paridade" }
serde_json = "1"

[features]
# Backend nativo AOT (LLVM IR -> Clang), ABI e emit-native. Só o clang.exe.
nativo = ["dep:dartforge-abi", "dep:dartforge-emit-native"]
# `dartforge run` e `dartforge reload` pelo JIT ORCv2 (crates/jit). Separado de
# `nativo` porque liga o executável à LLVM-C.dll da distribuição completa do
# LLVM 22.1.8: sem a DLL no PATH, o dartforge.exe não inicia.
jit = ["nativo", "dep:dartforge-jit"]

[[bin]]
name = "dartforge"
path = "src/main.rs"
