[package]
name = "dartforge-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
[lints]
workspace = true
[dependencies]
dartforge-abi = { path = "../abi", optional = true }
dartforge-emit-native = { path = "../emit_native", optional = true }
dartforge-jit = { path = "../jit", optional = true }
dartforge-emit-js = { path = "../emit_js" }
dartforge-dev = { path = "../dev" }
dartforge-build = { path = "../build" }
dartforge-elements = { path = "../elements" }
dartforge-formatter = { path = "../formatter" }
dartforge-frontend = { path = "../frontend" }
dartforge-intern = { path = "../intern" }
dartforge-macros-host = { path = "../macros_host" }
dartforge-parity = { path = "../parity" }
serde = "1"
serde_json = "1"
yaml-rust2 = "0.10"
semver = "1"
ureq = { version = "3", default-features = false, features = ["rustls"] }
flate2 = "1"
tar = "0.4"
sha2 = "0.10"
sha1 = "0.10"
url = "2"

[features]
# Native AOT backend (LLVM IR -> Clang), ABI and emit-native. Only clang.exe.
native = ["dep:dartforge-abi", "dep:dartforge-emit-native"]
# `dartforge run` and `dartforge reload` through the ORCv2 JIT (crates/jit). Separate
# from `native` because it links the executable to the LLVM-C.dll of the full
# LLVM 22.1.8 distribution: without the DLL on PATH, dartforge.exe does not start. With
# LLVM in the process, the AOT also generates the objects through it
# (`embedded-llvm`), without Clang.
jit = ["native", "dep:dartforge-jit", "dartforge-emit-native/embedded-llvm"]

[[bin]]
name = "dartforge"
path = "src/main.rs"
