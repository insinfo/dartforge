[package]
name = "dartforge-emit-native"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
dartforge-abi = { path = "../abi" }
dartforge-diagnostics = { path = "../diagnostics" }
dartforge-intern = { path = "../intern" }
dartforge-frontend = { path = "../frontend" }
dartforge-elements = { path = "../elements" }
dartforge-types = { path = "../types" }
# The closed world (RTA) of the program: what the lowering prunes (`src/native_world.rs`).
dartforge-world = { path = "../world" }
dartforge-runtime = { path = "../runtime" }
dartforge-instrument = { path = "../instrument" }
blake3 = "1"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
tempfile = "3"
# The embedded object generator (`src/generator.rs`): LLVM in the process, without
# Clang on the machine of whoever uses dartforge.
dartforge-llvm = { path = "../llvm", optional = true }
# Inspect native archive members without a subprocess or target execution.
object = { version = "0.39.1", default-features = false, features = ["read_core", "archive", "coff", "elf", "macho", "std"] }

[features]
embedded-llvm = ["dep:dartforge-llvm"]

[build-dependencies]
blake3 = "1"


[dev-dependencies]
url = "2"
