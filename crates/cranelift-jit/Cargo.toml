[package]
name = "dartforge-cranelift-jit"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
# Adota as lints do workspace: `unsafe_code = "deny"` obriga cada uso a aparecer
# num `#[allow(unsafe_code)]` pontual. Todo o `unsafe` deste crate fica em
# `src/execucao.rs`, que é onde o ponteiro de função do JIT é chamado.
[lints]
workspace = true
[dependencies]
dartforge-hir = { path = "../hir" }
dartforge-syntax = { path = "../syntax" }
dartforge-diagnostics = { path = "../diagnostics" }
cranelift-codegen = "=0.135.2"
cranelift-frontend = "=0.135.2"
cranelift-module = "=0.135.2"
cranelift-jit = "=0.135.2"
[dev-dependencies]
dartforge-lexer = { path = "../lexer" }
dartforge-parser = { path = "../parser" }
dartforge-semantic = { path = "../semantic" }
dartforge-llvm = { path = "../llvm" }
dartforge-native = { path = "../native" }
