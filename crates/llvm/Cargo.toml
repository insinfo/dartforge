[package]
name = "dartforge-llvm"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

# Adopts the workspace lint (`unsafe_code = "deny"`); the `unsafe` of the LLVM
# C API is all in `src/lib.rs`, the only file with `#![allow(unsafe_code)]`.
[lints]
workspace = true

[dependencies]
# `no-llvm-linking`: the signatures and the initialization wrappers come from
# llvm-sys, but whoever emits the link directives is this crate's `build.rs`
# (the shared library of the C API on Windows; see the top of build.rs).
# Keep wrapper headers on the same LLVM release line as our link selection.
llvm-sys = { version = "221.1.0", features = ["no-llvm-linking", "strict-versioning"] }
