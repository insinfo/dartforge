[package]
name = "dartforge-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
[lints]
workspace = true

[dependencies]
# A TLS do `dart:io` (fragmento `tls`): o rustls com o provedor `ring` (o
# `ring` também dá o SHA-1 do `X509Certificate.sha1`), as raízes do sistema
# e, sem nenhuma, as da Mozilla.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
ring = "0.17"
rustls-native-certs = "0.8"
webpki-roots = "1"
# Os filtros zlib/gzip do `dart:io` (fragmento `zlib`): o `flate2` sobre o
# zlib da VM (o clássico), compilado da fonte e ligado ESTATICAMENTE no
# runtime (`libz-sys` com `static`) — a mesma saída comprimida do `dart run`,
# e nada de zlib na máquina de quem usa o dartforge.
flate2 = { version = "1", default-features = false, features = ["zlib"] }
libz-sys = { version = "1", default-features = false, features = ["libc", "static"] }
# Os formatos de chave e certificado do `SecurityContext` que o rustls não lê
# (fragmento `tls_formatos`): PKCS#12 e chaves privadas cifradas (PBES2,
# as PBE do PKCS#12 e o PEM cifrado legado do OpenSSL). O HMAC, o PBKDF2 e
# os resumos vêm do `ring`; aqui só as cifras de bloco e o MD5 do
# `EVP_BytesToKey`.
aes = "0.8"
cbc = "0.1"
des = "0.8"
rc2 = "0.8"
md-5 = "0.10"

[features]
# O perfil do módulo `abi` (ver o build.rs): nenhuma feature é o JIT; `aot` e
# `dll` são as duas `staticlib` do AOT, montadas por `crates/runtime_estatico`.
aot = []
dll = []
