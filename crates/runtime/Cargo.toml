[package]
name = "dartforge-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
[lints]
workspace = true

[dependencies]
# The local time zone of `DateTime` (native targets; WebAssembly asks the host).
dartforge-local-time = { path = "../local_time" }

# Everything below belongs to `dart:io`, which the WebAssembly target does not
# have (docs/PLANO-WASM-MVP.md §1): its fragments are left out of the wasm32
# runtime (build.rs), and so are their crates.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The TLS of `dart:io` (fragment `tls`): rustls with the `ring` provider (
# `ring` also gives the SHA-1 of `X509Certificate.sha1`), the system roots
# and, without any, Mozilla's.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
ring = "0.17"
rustls-native-certs = "0.8"
webpki-roots = "1"
# The zlib/gzip filters of `dart:io` (fragment `zlib`): `flate2` over the
# VM's zlib (the classic one), compiled from source and linked STATICALLY into the
# runtime (`libz-sys` with `static`) — the same compressed output as `dart run`,
# and no zlib needed on the machine of whoever uses dartforge.
flate2 = { version = "1", default-features = false, features = ["zlib"] }
libz-sys = { version = "1", default-features = false, features = ["libc", "static"] }
# The key and certificate formats of `SecurityContext` that rustls does not read
# (fragment `tls_formats`): PKCS#12 and encrypted private keys (PBES2,
# the PKCS#12 PBEs and OpenSSL's legacy encrypted PEM). HMAC, PBKDF2 and
# the digests come from `ring`; here only the block ciphers and the MD5 of
# `EVP_BytesToKey`.
aes = "0.8"
cbc = "0.1"
des = "0.8"
rc2 = "0.8"
md-5 = "0.10"

# The compressed RTI tables (`rti_table.rs`) on WebAssembly: the same deflate
# format through the pure-Rust backend, with no C zlib to build for wasm32.
[target.'cfg(target_arch = "wasm32")'.dependencies]
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }

[features]
# The profile of the `abi` module (see build.rs): no feature is the JIT; `aot` and
# `dll` are the two AOT `staticlib`s, assembled by `crates/runtime_static`.
aot = []
dll = []
