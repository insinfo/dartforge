[package]
name = "dartforge-instrument"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
# This crate does not adopt the workspace lint `unsafe_code = "forbid"` because a
# global allocator requires `unsafe impl GlobalAlloc`. The rest of the workspace
# keeps forbidding unsafe; the exception is contained here and auditable.
[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
