[package]
name = "dartforge-instrument"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
# Este crate não adota a lint workspace `unsafe_code = "forbid"` porque um
# alocador global exige `unsafe impl GlobalAlloc`. Todo o restante do workspace
# continua proibindo unsafe; a exceção fica contida aqui e é auditável.
[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
[dependencies]
