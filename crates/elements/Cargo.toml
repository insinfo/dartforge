[package]
name = "dartforge-elements"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
[lints]
workspace = true
[dependencies]
dartforge-diagnostics = { path = "../diagnostics" }
dartforge-intern = { path = "../intern" }
dartforge-frontend = { path = "../frontend" }
serde = { version = "1", features = ["derive"] }
