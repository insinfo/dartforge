[package]
name = "dartforge-jit"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

# Este crate adota a lint do workspace (`unsafe_code = "deny"`). Todo o `unsafe`
# está concentrado em `src/ffi.rs`, único arquivo com `#![allow(unsafe_code)]`;
# `src/lib.rs` e `src/reload.rs` permanecem 100% seguros.
[lints]
workspace = true

[dependencies]
# O `heap` do runtime vem daqui; o harness (`runtime_main.rs`) é compilado neste
# crate a partir da mesma fonte, por `build.rs` (provisório até a fonte única).
dartforge-runtime = { path = "../runtime" }
# `no-llvm-linking`: as assinaturas e os invólucros de inicialização vêm daqui,
# mas quem emite as diretivas de ligação é o `build.rs` deste crate, que liga a
# biblioteca compartilhada da API C. O motivo está documentado lá e em
# docs/JIT.md: as bibliotecas estáticas do pacote oficial de Windows usam CRT
# estática e conflitam com a CRT dinâmica do Rust.
llvm-sys = { version = "221.1.0", features = ["no-llvm-linking"] }

[dev-dependencies]
# Só para `tests/execucao.rs`: produzir o IR de um programa Dart pela trilha
# nova (`emitir_ir`) e ligá-lo pelo driver AOT, para o diferencial JIT × AOT
# sobre o mesmo texto.
dartforge-emit-native = { path = "../emit_native" }

# Executor isolado: um processo por programa, para que `process::exit` e
# `abort` do runtime encerrem a execução e não quem a pediu (testes, harness).
[[bin]]
name = "dartforge-executar-ir"
path = "src/bin/executar_ir.rs"
