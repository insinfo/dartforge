[package]
name = "dartforge-jit"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

# This crate adopts the workspace lint (`unsafe_code = "deny"`). All the `unsafe`
# is concentrated in `src/ffi.rs`, the only file with `#![allow(unsafe_code)]`;
# `src/lib.rs` and `src/reload.rs` stay 100% safe.
[lints]
workspace = true

[dependencies]
dartforge-abi = { path = "../abi" }
# The runtime: `abi` (the same fragments of `crates/runtime/src` the AOT links) and the symbol
# table generated from it (`simbolos`). Single source, see crates/runtime/src/lib.rs.
dartforge-runtime = { path = "../runtime" }
# The signatures of the LLVM C API (`no-llvm-linking`). Linking with LLVM
# comes from `dartforge-llvm` (its `build.rs`), which also initializes the native
# target once per process for the JIT and for the AOT object generator.
dartforge-llvm = { path = "../llvm" }
llvm-sys = { version = "221.1.0", features = ["no-llvm-linking"] }

[dev-dependencies]
# Only for `tests/execution.rs`: produce the IR of a Dart program through the new
# track (`emitir_ir`) and link it through the AOT driver, for the JIT × AOT differential
# over the same text.
dartforge-emit-native = { path = "../emit_native" }

# Isolated executor: one process per program, so that the runtime's `process::exit` and
# `abort` end the execution and not whoever requested it (tests, harness).
[[bin]]
name = "dartforge-run-ir"
path = "src/bin/run_ir.rs"
