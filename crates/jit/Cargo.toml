[package]
name = "dartforge-jit"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

# Este crate adota a lint do workspace (`unsafe_code = "deny"`). Todo o `unsafe`
# está concentrado em `src/ffi.rs`, único arquivo com `#![allow(unsafe_code)]`;
# `src/lib.rs` e `src/reload.rs` permanecem 100% seguros.
[lints]
workspace = true

[dependencies]
# O runtime: `abi` (os mesmos fragmentos de `crates/runtime/src` que o AOT liga) e a tabela de
# símbolos gerada dele (`simbolos`). Fonte única, ver crates/runtime/src/lib.rs.
dartforge-runtime = { path = "../runtime" }
# As assinaturas da API C do LLVM (`no-llvm-linking`). A ligação com o LLVM
# vem de `dartforge-llvm` (o `build.rs` dele), que também inicializa o alvo
# nativo uma vez por processo para o JIT e para o gerador de objetos do AOT.
dartforge-llvm = { path = "../llvm" }
llvm-sys = { version = "221.1.0", features = ["no-llvm-linking"] }

[dev-dependencies]
# Só para `tests/execucao.rs`: produzir o IR de um programa Dart pela trilha
# nova (`emitir_ir`) e ligá-lo pelo driver AOT, para o diferencial JIT × AOT
# sobre o mesmo texto.
dartforge-emit-native = { path = "../emit_native" }

# Executor isolado: um processo por programa, para que `process::exit` e
# `abort` do runtime encerrem a execução e não quem a pediu (testes, harness).
[[bin]]
name = "dartforge-executar-ir"
path = "src/bin/executar_ir.rs"
