[package]
name = "dartforge-jit"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

# Este crate adota a lint do workspace (`unsafe_code = "deny"`). Todo o `unsafe`
# está concentrado em `src/ffi.rs`, único arquivo com `#![allow(unsafe_code)]`;
# `src/runtime.rs` e `src/lib.rs` permanecem 100% seguros.
[lints]
workspace = true

[dependencies]
dartforge-runtime = { path = "../runtime" }
# `no-llvm-linking`: as assinaturas e os invólucros de inicialização vêm daqui,
# mas quem emite as diretivas de ligação é o `build.rs` deste crate, que liga a
# biblioteca compartilhada da API C. O motivo está documentado lá e em
# docs/JIT.md: as bibliotecas estáticas do pacote oficial de Windows usam CRT
# estática e conflitam com a CRT dinâmica do Rust.
llvm-sys = { version = "221.1.0", features = ["no-llvm-linking"] }

[dev-dependencies]
dartforge-compiler = { path = "../compiler" }
dartforge-native = { path = "../native" }
