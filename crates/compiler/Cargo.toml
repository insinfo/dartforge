license.workspace = true
publish = false
[lints]
workspace = true
[dependencies]
dartforge-macros = { path = "../macros" }
dartforge-syntax = { path = "../syntax" }
dartforge-diagnostics = { path = "../diagnostics" }
dartforge-lexer = { path = "../lexer" }
dartforge-parser = { path = "../parser" }
dartforge-semantic = { path = "../semantic" }
dartforge-hir = { path = "../hir" }
dartforge-codegen = { path = "../codegen" }
dartforge-optimizer = { path = "../optimizer" }
dartforge-linker = { path = "../linker" }
