[package]
name = "dartforge-wasm-host"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Independent executor of DartForge wasm32-linear modules (host ABI v1)"

[lints]
workspace = true

[[bin]]
name = "dartforge-wasm-run"
path = "src/bin/run.rs"

[dependencies]
# Wasmtime (Cranelift), independent of the browsers' engines and with every
# feature of the profile, Wasm exceptions included (they need the `gc` crate
# feature for `exnref` objects; the WasmGC proposal itself stays off).
wasmtime = { version = "=50.0.0", default-features = false, features = ["cranelift", "runtime", "std", "gc", "gc-drc"] }
dartforge-wasm-gate = { path = "../wasm_gate" }

[dev-dependencies]
wat = "=1.262.0"
