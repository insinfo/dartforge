[package]
name = "dartforge-emit-js-producao"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
dartforge-emit-js = { path = "../emit_js" }
dartforge-mundo = { path = "../mundo" }
dartforge-elements = { path = "../elements" }
dartforge-intern = { path = "../intern" }
serde = { version = "1", features = ["derive"] }
postcard = { version = "1", default-features = false, features = ["use-std"] }

[lib]
path = "src/lib.rs"

[[bin]]
name = "dartforge-jsprod"
path = "src/main.rs"
