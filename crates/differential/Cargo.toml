[package]
name = "dartforge-differential"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
dartforge-emit-native = { path = "../emit_native" }
dartforge-frontend = { path = "../frontend" }

[features]
# The object generator embedded in the harness AOT (crates/emit_native/src/generator.rs);
# without it, the harness generates objects with the Clang of `DARTFORGE_CLANG`.
embedded-llvm = ["dartforge-emit-native/embedded-llvm"]

[lib]
path = "src/lib.rs"

[[bin]]
name = "dartforge-differential"
path = "src/main.rs"
