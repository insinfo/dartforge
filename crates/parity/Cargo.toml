[package]
name = "dartforge-parity"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
dartforge-diagnostics = { path = "../diagnostics" }
dartforge-intern = { path = "../intern" }
dartforge-frontend = { path = "../frontend" }
dartforge-elements = { path = "../elements" }
dartforge-types = { path = "../types" }
dartforge-analysis = { path = "../analysis" }
dartforge-instrument = { path = "../instrument" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
yaml-rust2 = "0.10"

[lib]
path = "src/lib.rs"

[[bin]]
name = "dartforge-parity"
path = "src/main.rs"

[dev-dependencies]
tempfile = "3"

[[example]]
name = "probe_files"
test = true
