[package]
name = "dartforge-build"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Motor de geração de código do DartForge: o plano de fases do build_runner, impressão digital por consulta e executores (nativo, Dart, apoio)."

[lints]
workspace = true

[features]
default = ["native-generators"]
# Native generators (ngdart and sass) through ng_generator, via its public API only.
native-generators = ["dep:dartforge-ng-generator"]

[dependencies]
dartforge-elements = { path = "../elements" }
dartforge-frontend = { path = "../frontend" }
dartforge-intern = { path = "../intern" }
dartforge-dfexec = { path = "../dfexec" }
dartforge-ng-generator = { path = "../ng_generator", optional = true }
base64 = "0.22"
blake3 = "1"
yaml-rust2 = "0.10"
serde_json = "1"
url = "2.5"

[dev-dependencies]
tempfile = "3"
