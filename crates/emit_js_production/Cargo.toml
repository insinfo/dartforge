[package]
name = "dartforge-emit-js-production"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
dartforge-emit-js = { path = "../emit_js" }
dartforge-world = { path = "../world" }
dartforge-elements = { path = "../elements" }
dartforge-intern = { path = "../intern" }
dartforge-types = { path = "../types" }
dartforge-frontend = { path = "../frontend" }
serde = { version = "1", features = ["derive"] }
postcard = { version = "1", default-features = false, features = ["use-std"] }
serde_json = "1"
# Scope-aware identifier minification (docs/JS-PRODUCAO-SDK-PROPRIO.md §7.2).
oxc_allocator = "0.152"
oxc_parser = "0.152"
oxc_span = "0.152"
oxc_mangler = "0.152"
oxc_codegen = "0.152"
# Property renaming and compression (docs/JS-PRODUCAO-TAMANHO.md §3).
oxc_minifier = "0.152"
oxc_ast = "0.152"
oxc_ast_visit = "0.152"
oxc_syntax = "0.152"
# Bindings never written, for the inliner's argument order (`inline.rs`).
oxc_semantic = "0.152"

[lib]
path = "src/lib.rs"

[[bin]]
name = "dartforge-jsprod"
path = "src/main.rs"

