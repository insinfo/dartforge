# Testes PESADOS da trilha nova, no GitHub Actions e não na máquina de
# desenvolvimento: o corpus diferencial (crates/diferencial) nos perfis JS de
# desenvolvimento e de produção, no backend nativo (em fragmentos paralelos) e
# o teste de determinismo. Ver ESTADO.md §3 (convenção ci/<frente>, limites) e
# scripts/ci.ps1 (disparar, acompanhar, ler o placar).
#
# Como pedir uma rodada:
#   * empurrar para uma branch ci/<frente> (roda `todos`):
#       pwsh scripts/ci.ps1 -Frente nativo        # git push origin HEAD:ci/nativo
#   * workflow_dispatch, escolhendo a suíte e o número de fragmentos:
#       gh workflow run pesado.yml --ref <branch> -f suite=nativo -f fragmentos=8
#   * o agendamento diário roda `todos` no main de madrugada — é também o que
#     mantém os caches no escopo do main, que toda branch ci/** pode ler.
#
# Jobs de uma rodada `todos` com N fragmentos: compilar; depois, EM PARALELO,
# js, producao, moderno, macros, determinismo (produção), determinismo
# (nativo), N nativos e o nativo sob --gc-stress; depois nativo-placar (Linux,
# segundos), que também compara os dois placares nativos. Pico de
# simultaneidade = 7 + N.
# O plano gratuito permite 20 jobs simultâneos na conta inteira (Linux e
# Windows juntos); o excedente espera na fila, não falha.
#
# N padrão = 2, pela medição (ESTADO.md §3.2): no runner o corpus nativo
# inteiro leva ~45 s de harness somando os fragmentos, e cada job gasta ~1,3 min
# só preparando o ambiente — mais fragmentos só compram fila. Com N = 2 a rodada
# ocupa 6 jobs no pico e cabem três frentes ao mesmo tempo. Subir N (input
# `fragmentos` ou `gh variable set FRAGMENTOS_NATIVO --body N`) quando o tempo
# de um fragmento passar de ~20 min, o que acontecerá quando os programas
# nativos passarem a rodar até o fim em vez de falhar cedo.
name: Pesado
on:
  workflow_dispatch:
    inputs:
      suite:
        description: O que rodar
        type: choice
        options: [todos, js, producao, limitless-ui, nativo, jit, determinismo, moderno, macros, macros-aot-sonda, custo-zero, analise]
        default: todos
      fragmentos:
        description: Fragmentos do corpus nativo (um job cada)
        type: number
        default: 2
  push:
    branches: ['ci/**']
  schedule:
    # 06:17 UTC = 03:17 em Brasília.
    - cron: '17 6 * * *'
permissions:
  contents: read
# Uma rodada nova cancela a anterior DA MESMA branch; branches diferentes
# (uma por frente de trabalho) nunca se cancelam.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: '0'
  # Teto do heap do runtime nativo por programa (crates/runtime/src/heap.rs).
  DARTFORGE_HEAP_MAX_MB: '256'
jobs:
  compilar:
    name: compilar
    runs-on: windows-latest
    timeout-minutes: 60
    outputs:
      suite: ${{ steps.plano.outputs.suite }}
      n: ${{ steps.plano.outputs.n }}
      fragmentos: ${{ steps.plano.outputs.fragmentos }}
    steps:
      - name: Plano da rodada
        id: plano
        shell: pwsh
        env:
          SUITE: ${{ inputs.suite || 'todos' }}
          # workflow_dispatch > variável do repositório > 2.
          N: ${{ inputs.fragmentos || vars.FRAGMENTOS_NATIVO || 2 }}
        run: |
          $n = [int]$env:N
          if ($n -lt 1 -or $n -gt 32) { throw "fragmentos fora de 1..32: $n" }
          # -InputObject, não -AsArray: este embrulharia a lista noutra ([[1,…]]).
          $lista = ConvertTo-Json -Compress -InputObject @(1..$n)
          "suite=$env:SUITE" >> $env:GITHUB_OUTPUT
          "n=$n" >> $env:GITHUB_OUTPUT
          "fragmentos=$lista" >> $env:GITHUB_OUTPUT
          Write-Host "suite $env:SUITE; $n fragmentos nativos: $lista"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
      - uses: ./.github/actions/dart
        with:
          gerar-dart-sdk-js: 'true'
      # O executor do JIT (crates/jit) liga o llvm-sys: precisa do recorte de
      # desenvolvimento do LLVM (llvm-config, LLVM-C, cabeçalhos da API C).
      - uses: ./.github/actions/llvm-windows
        with:
          desenvolvimento: 'true'
      - name: Rust fixado (rust-toolchain.toml)
        run: rustup toolchain install 1.98.1 --profile minimal
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: pesado-release
          # Só o main grava; as branches ci/** restauram o do main.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Compilar harness, dartforge, dartforge-jsprod, paridade e o executor do JIT (release)
        env:
          # O perfil release do workspace (LTO thin, 1 unidade de geração de
          # código) é para medir desempenho; aqui só a correção importa, e ele
          # multiplica o tempo de compilação num runner de 4 núcleos.
          CARGO_PROFILE_RELEASE_LTO: 'false'
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '16'
        run: cargo build --locked --release -p dartforge-diferencial -p dartforge-cli -p dartforge-emit-js-producao -p dartforge-jit -p dartforge-paridade
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: binarios
          path: |
            target/release/dartforge-diferencial.exe
            target/release/dartforge.exe
            target/release/dartforge-jsprod.exe
            target/release/dartforge-executar-ir.exe
            target/release/dartforge-paridade.exe
            runtime/ddc/dart_sdk.js
          retention-days: 1
          if-no-files-found: error

      # Os oráculos (`dart run` e `dartdevc`+Node) não dependem do nosso
      # código: o harness os guarda em target/diferencial/cache por hash do
      # conteúdo de cada programa. Este job completa o cache uma vez, e os
      # jobs seguintes só o leem. A chave muda com o corpus; o restore-keys
      # traz o cache anterior, e só os programas alterados são recalculados.
      - name: Oráculos (cache)
        id: oraculos
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: target/diferencial/cache
          key: oraculos-${{ runner.os }}-dart3.6.2-${{ hashFiles('corpus/js/**') }}
          restore-keys: oraculos-${{ runner.os }}-dart3.6.2-
      - name: Completar os oráculos (dartforge-diferencial verificar)
        shell: pwsh
        run: |
          $inicio = Get-Date
          ./target/release/dartforge-diferencial.exe verificar --silencioso > verificar.txt
          $codigo = $LASTEXITCODE
          Get-Content verificar.txt -Encoding utf8 | Select-Object -Last 5
          Write-Host ("código {0}; {1:N0} s" -f $codigo, ((Get-Date) - $inicio).TotalSeconds)
          # Código 1 aqui é divergência dos ORÁCULOS entre si (DDC × VM), não
          # defeito nosso: fica registrado no resumo, mas não impede o resto.
          if ($codigo -ne 0) {
            $md = @('### Oráculos', '', "verificar saiu com código $codigo", '', '```text')
            $md += Get-Content verificar.txt -Encoding utf8
            $md += '```'
            Add-Content $env:GITHUB_STEP_SUMMARY ($md -join "`n") -Encoding utf8
          }
          exit 0
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        if: steps.oraculos.outputs.cache-hit != 'true'
        with:
          path: target/diferencial/cache
          key: oraculos-${{ runner.os }}-dart3.6.2-${{ hashFiles('corpus/js/**') }}

  js:
    name: js (desenvolvimento)
    needs: compilar
    if: contains(fromJSON('["todos","js"]'), needs.compilar.outputs.suite)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/harness
        with:
          nome: js
          titulo: JS desenvolvimento — dart run × ddc+node × dartforge+node
          args: --jobs 4

  producao:
    name: js (produção)
    needs: compilar
    if: contains(fromJSON('["todos","producao"]'), needs.compilar.outputs.suite)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/harness
        with:
          nome: producao
          titulo: JS produção — VM × desenvolvimento × produção (dartforge-jsprod)
          args: --producao --jobs 4

  # A galeria pública fornece 26 testes Puppeteer de comportamento real.
  # Revisão fixa: mudanças no oráculo não alteram silenciosamente o placar.
  limitless-ui:
    name: limitless_ui (bundle de produção, e2e)
    needs: compilar
    if: needs.compilar.outputs.suite == 'limitless-ui' || (needs.compilar.outputs.suite == 'todos' && github.ref == 'refs/heads/ci/js')
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: insinfo/limitless_ui
          ref: 9e381736413e635e4d616046fbe82997ccf66a08
          path: references/limitless_ui
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
      - uses: ./.github/actions/dart
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: binarios
          path: ${{ github.workspace }}
      - name: Preparar os gerados do ngdart
        shell: pwsh
        run: pwsh scripts/limitless-ui.ps1 -Preparar -Producao
      - name: Montar o bundle de produção
        shell: pwsh
        run: pwsh scripts/limitless-ui.ps1 -Montar -Producao
      - name: E2E no navegador
        shell: pwsh
        run: |
          $raiz = (Resolve-Path references/limitless_ui).Path
          $saida = (Resolve-Path work/lui/out-producao).Path
          $servidor = Start-Process -FilePath (Get-Command dart).Source `
            -ArgumentList @('run', 'tool/serve_example.dart', '--dir', $saida, '--port', '8081', '--quiet') `
            -WorkingDirectory $raiz -WindowStyle Hidden -PassThru
          try {
            $pronto = $false
            foreach ($tentativa in 1..60) {
              try {
                $resposta = Invoke-WebRequest 'http://127.0.0.1:8081/' -TimeoutSec 2
                if ($resposta.StatusCode -eq 200) { $pronto = $true; break }
              } catch { Start-Sleep -Seconds 1 }
            }
            if (-not $pronto) { throw 'servidor da galeria não iniciou' }
            node scripts/sondar-limitless-ui.mjs 'http://127.0.0.1:8081/'
            if ($LASTEXITCODE -ne 0) { throw 'startup da galeria falhou; veja o diagnóstico CDP acima' }
            pwsh scripts/limitless-ui.ps1 -E2e -Producao
            if ($LASTEXITCODE -ne 0) { throw "E2E falhou (código $LASTEXITCODE)" }
          } finally {
            Stop-Process -Id $servidor.Id -Force -ErrorAction SilentlyContinue
          }

  # Recursos 3.7–3.13 (docs/VERSOES-LINGUAGEM.md §5): o corpus/moderno contra
  # o SDK de oráculo 3.13.4 (dart run e dartdevc+node, cada um com o seu
  # dart_sdk.js), no perfil de desenvolvimento e no de produção. Código 0 =
  # todos passam; o que está em corpus/moderno/PENDENTES pode falhar, mas
  # passar sem sair da lista reprova.
  moderno:
    name: moderno (3.7–3.13)
    needs: compilar
    if: contains(fromJSON('["todos","moderno"]'), needs.compilar.outputs.suite)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/harness
        with:
          nome: moderno
          titulo: Moderno (3.7–3.13) — VM e DDC 3.13.4 × dartforge dev e produção
          args: --corpus corpus/moderno --producao --jobs 4
          sdk-313: 'true'

  # Augmentations e macros (docs/AUGMENTATIONS.md, docs/MACROS-PROTOCOLO.md):
  # o corpus/macros contra o 3.6.2 com --enable-experiment=macros (a forma
  # `import augment`/`augment library`) e contra o 3.13.4 com
  # augmentations,enhanced-parts (a forma `part of`), no perfil de
  # desenvolvimento e no de produção. Mesmo critério do `moderno`.
  macros:
    name: macros (augmentations)
    needs: compilar
    if: contains(fromJSON('["todos","macros"]'), needs.compilar.outputs.suite)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/harness
        with:
          nome: macros
          titulo: Macros e augmentations — VM e DDC (3.6.2 e 3.13.4) × dartforge dev e produção
          args: --corpus corpus/macros --producao --jobs 4
          sdk-313: 'true'
          pub-get: corpus/macros
          preparar: ./scripts/preparar-macros-410.ps1
      - name: Macro com argumento posicional (CFE byte a byte)
        shell: pwsh
        run: ./scripts/testar-macros-412.ps1
      - name: Macro com argumento nomeado (CFE byte a byte)
        shell: pwsh
        run: ./scripts/testar-macros-413.ps1
      - name: Macro em função de topo (CFE byte a byte)
        shell: pwsh
        run: ./scripts/testar-macros-414.ps1
      - name: Macro em variável de topo (CFE byte a byte)
        shell: pwsh
        run: ./scripts/testar-macros-415.ps1
      - name: Macro na definição de função (CFE byte a byte)
        shell: pwsh
        run: ./scripts/testar-macros-416.ps1
      - name: Macro na definição de método (CFE byte a byte)
        shell: pwsh
        run: ./scripts/testar-macros-418.ps1

  macros-aot-sonda:
    name: sonda AOT do executor de macros
    needs: compilar
    if: needs.compilar.outputs.suite == 'macros-aot-sonda'
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/dart
      - uses: ./.github/actions/llvm-windows
      - name: Rust fixado (rust-toolchain.toml)
        run: rustup toolchain install 1.98.1 --profile minimal
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: pesado-release
          save-if: 'false'
      - name: Compilar CLI nativa
        env:
          CARGO_PROFILE_RELEASE_LTO: 'false'
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '16'
        run: cargo build --locked --release -p dartforge-cli --features nativo
      - name: Primeiro erro do bootstrap dfexec/1
        shell: pwsh
        run: ./scripts/sondar-macros-aot.ps1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sonda-macros-aot
          path: target/macros-aot-sonda/compile-native.txt
          retention-days: 7

  nativo:
    name: nativo ${{ matrix.fragmento }}/${{ needs.compilar.outputs.n }}
    needs: compilar
    if: contains(fromJSON('["todos","nativo"]'), needs.compilar.outputs.suite)
    runs-on: windows-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        fragmento: ${{ fromJSON(needs.compilar.outputs.fragmentos) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/harness
        with:
          nome: nativo-${{ matrix.fragmento }}
          titulo: Nativo, fragmento ${{ matrix.fragmento }}/${{ needs.compilar.outputs.n }}
          args: --nativo --jobs 4 --fragmento ${{ matrix.fragmento }}/${{ needs.compilar.outputs.n }}
          nativo: 'true'
          # Placar abaixo de 214 é o estado do backend, não quebra do CI.
          aceitar-placar-parcial: 'true'

  # O portão G7 do contrato de raízes (docs/NATIVO-PLANO.md §6.5): o corpus
  # nativo inteiro com DARTFORGE_GC_STRESS=1 — coleta antes de TODA
  # alocação, então uma raiz faltando vira "handle já coletado" em vez de
  # passar por sorte. O `nativo-placar` compara: um programa que passa sem
  # estresse e falha com ele reprova a rodada. O tempo-limite de execução é
  # maior (a coleta a cada alocação multiplica o tempo dos programas).
  nativo-gc-stress:
    name: nativo --gc-stress (corpus inteiro)
    needs: compilar
    if: contains(fromJSON('["todos","nativo"]'), needs.compilar.outputs.suite)
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/harness
        with:
          nome: nativo-gc-stress
          titulo: Nativo sob --gc-stress (coleta antes de toda alocação)
          args: --nativo --gc-stress --jobs 4 --limite-exec 120
          nativo: 'true'
          aceitar-placar-parcial: 'true'

  nativo-placar:
    name: nativo (placar consolidado)
    needs: [compilar, nativo, nativo-gc-stress]
    if: always() && needs.compilar.result == 'success' && contains(fromJSON('["todos","nativo"]'), needs.compilar.outputs.suite)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: relatorio-nativo-*
          path: fragmentos
      - name: Somar os fragmentos
        shell: pwsh
        env:
          N: ${{ needs.compilar.outputs.n }}
        run: |
          # O relatório do --gc-stress vem no mesmo padrão de artefato, mas
          # não é fragmento: fica de fora da soma e é comparado abaixo.
          $todos = @(Get-ChildItem fragmentos -Recurse -Filter relatorio.txt | Sort-Object FullName)
          $rels = @($todos | Where-Object { $_.FullName -notmatch 'relatorio-nativo-gc-stress' })
          $estresse = $todos | Where-Object { $_.FullName -match 'relatorio-nativo-gc-stress' } | Select-Object -First 1
          New-Item -ItemType Directory -Force placar | Out-Null
          $md = & ./scripts/ci-placar.ps1 -Relatorio $rels -Titulo "Nativo — corpus inteiro ($($rels.Count) de $env:N fragmentos)" -Esperados ([int]$env:N)
          $uma = & ./scripts/ci-placar.ps1 -Relatorio $rels -Linha -Esperados ([int]$env:N)
          # Tempo de cada fragmento, para dimensionar N (ver ESTADO.md §3.2).
          $tempos = foreach ($f in Get-ChildItem fragmentos -Recurse -Filter placar.md | Where-Object { $_.FullName -notmatch 'relatorio-nativo-gc-stress' } | Sort-Object FullName) {
            $t = (Get-Content $f -Encoding utf8) -join ' '
            if ($t -match 'Tempo do harness no runner: (.+?)\. Memória livre mínima: (.+? GB)') { "| $($f.Directory.Name) | $($Matches[1]) | $($Matches[2]) |" }
          }
          $md += "`n`n| fragmento | tempo do harness | memória livre mínima |`n| --- | --- | --- |`n" + ($tempos -join "`n") + "`n"
          Set-Content placar/placar.md $md -Encoding utf8
          $rels | Get-Content -Encoding utf8 | Set-Content placar/relatorios-concatenados.txt -Encoding utf8
          Add-Content $env:GITHUB_STEP_SUMMARY $md -Encoding utf8
          Write-Host $md
          Write-Host "::notice title=Placar nativo::$uma"
          if ($rels.Count -eq 0) { Write-Host '::error::nenhum fragmento produziu relatório'; exit 1 }
          # Portão G7: o que passa sem estresse passa com ele.
          if (!$estresse) { Write-Host '::error::o job nativo-gc-stress não produziu relatório'; exit 1 }
          $falhas = { param($arqs) $arqs | Get-Content -Encoding utf8 | ForEach-Object { if ($_ -match '^\s*FALHA\s+(\S+)') { $Matches[1] } } | Sort-Object -Unique }
          $normal = @(& $falhas $rels)
          $sob = @(& $falhas @($estresse))
          $so_sob = @($sob | Where-Object { $normal -notcontains $_ })
          $g7 = "--gc-stress: $($sob.Count) falhas (sem estresse: $($normal.Count)); só com estresse: $($so_sob.Count)"
          Add-Content $env:GITHUB_STEP_SUMMARY "`n$g7`n" -Encoding utf8
          Write-Host "::notice title=Placar nativo --gc-stress::$g7"
          if ($so_sob.Count -gt 0) {
            Write-Host "::error::passam sem estresse e falham com --gc-stress (raiz faltando?): $($so_sob -join ', ')"
            exit 1
          }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: placar-nativo
          path: placar
          retention-days: 14

  # O SDK compilado da fonte (P5c/P5d, docs/NATIVO-PLANO.md §7.7), ainda
  # opt-in: o corpus nativo inteiro com DARTFORGE_SDK_DA_FONTE=1 (a DLL do SDK
  # é compilada uma vez, no primeiro programa), e o perfil de produção — UM
  # executável autocontido, que o teste copia sozinho para uma pasta vazia e
  # executa. O artefato não entra no placar consolidado do nativo de hoje.
  sdk-fonte:
    name: nativo (SDK da fonte)
    needs: compilar
    if: contains(fromJSON('["todos","nativo"]'), needs.compilar.outputs.suite)
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      DARTFORGE_SDK_DA_FONTE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/harness
        with:
          nome: sdk-fonte
          titulo: Nativo com o SDK da fonte (DARTFORGE_SDK_DA_FONTE=1)
          args: --nativo --jobs 4
          nativo: 'true'
          aceitar-placar-parcial: 'true'
      - name: Aridade de closure lança NoSuchMethodError da fonte
        shell: pwsh
        run: cargo test --locked --release -p dartforge-emit-native --test contrato aridade_closure_lanca_no_such_method_error_da_fonte -- --ignored --nocapture
      - name: Getter estático de função executa com ordem correta
        shell: pwsh
        run: cargo test --locked --release -p dartforge-emit-native --test contrato getter_estatico_que_retorna_funcao_e_chamado_como_valor -- --ignored --nocapture
      - name: Factory redirecionadora preserva RTI do destino
        shell: pwsh
        run: cargo test --locked --release -p dartforge-emit-native --test contrato factory_redirecionadora_preserva_rti_do_destino -- --ignored --nocapture
      - name: Getter de interface despacha campo e getter
        shell: pwsh
        run: cargo test --locked --release -p dartforge-emit-native --test contrato getter_de_interface_despacha_campo_e_getter -- --ignored --nocapture
      # JIT × AOT com o SDK da fonte: o executor carrega a DLL do SDK; os
      # tempos pós-IR (Clang + ligação, sem o cache de objetos) são o lado
      # nativo do portão de custo (comparar com o job `jit`).
      - uses: ./.github/actions/harness
        env:
          DARTFORGE_CACHE_OBJ: '0'
        with:
          nome: sdk-fonte-jit
          titulo: JIT × AOT com o SDK da fonte
          args: --jit-aot --jobs 1
          nativo: 'true'
          jit: 'true'
          aceitar-placar-parcial: 'true'
          exige: '^JIT × AOT: '
      - name: Recarga JIT da CLI com SDK da fonte
        shell: pwsh
        run: cargo test --locked -p dartforge-cli --features jit --test reload_estado cli_preserva_estatico_com_sdk_da_fonte -- --ignored --nocapture
      - name: Produção autocontida (um .exe, sem DLL do DartForge)
        shell: pwsh
        env:
          CARGO_PROFILE_RELEASE_LTO: 'false'
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '16'
        run: cargo test --locked --release -p dartforge-emit-native --lib producao_e_um_executavel_autocontido -- --ignored --nocapture

  # O perfil de DESENVOLVIMENTO do nativo: cada programa pelo JIT ORCv2 e, do
  # MESMO LLVM IR, pelo AOT (Clang + ligação). Exige os dois idênticos programa
  # a programa (stdout e código; a linha `JIT × AOT: … 0 divergentes` do
  # relatório): qualquer divergência é defeito do JIT, mesmo com o placar
  # contra a VM baixo. Mede o tempo pós-IR de cada perfil. Corpus inteiro num
  # job só e `--jobs 1`, para que os tempos não disputem a máquina entre si; o
  # cache de objetos fica desligado, senão o Clang não rodaria nos repetidos.
  jit:
    name: jit × aot (corpus inteiro)
    needs: compilar
    if: contains(fromJSON('["todos","jit"]'), needs.compilar.outputs.suite)
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      DARTFORGE_CACHE_OBJ: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/harness
        with:
          nome: jit
          titulo: JIT × AOT — o mesmo LLVM IR pelos dois perfis, contra a VM
          args: --jit-aot --jobs 1
          nativo: 'true'
          jit: 'true'
          aceitar-placar-parcial: 'true'
          # Relatório válido só com ZERO divergências JIT × AOT.
          exige: '^JIT × AOT: [0-9]+/[0-9]+ idênticos, 0 divergentes'

  determinismo:
    name: determinismo (produção)
    needs: compilar
    if: contains(fromJSON('["todos","determinismo"]'), needs.compilar.outputs.suite)
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/harness
        with:
          nome: determinismo-producao
          titulo: Determinismo — produção, 1/4/8 trabalhadores
          args: determinismo --producao --trabalhadores 1,4,8
          exige: '^determinismo: '

  # Determinismo do NATIVO pelo LLVM IR emitido de cada programa, sem Clang,
  # ligação nem execução (crates/diferencial, `determinismo --nativo`; o modo
  # antigo, que executa tudo, é `--executar`). Não precisa de Rust nem de LLVM.
  determinismo-nativo:
    name: determinismo (nativo, IR)
    needs: compilar
    if: contains(fromJSON('["todos","determinismo"]'), needs.compilar.outputs.suite)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/harness
        with:
          nome: determinismo-nativo
          titulo: Determinismo — nativo (LLVM IR por programa), 1/4/8 trabalhadores
          args: determinismo --nativo --trabalhadores 1,4,8
          exige: '^determinismo \(IR\): '
  # Paridade de diagnósticos com o `dart analyze` (crates/paridade, plano A1):
  # o nosso analisador sobre corpus/diagnosticos contra o oráculo GRAVADO em
  # disco (oraculo.jsonl de cada grupo, regravado localmente pelo
  # `dartforge-paridade oraculo` com os SDKs 3.6.2 e 3.13.4) — o runner não
  # roda `dart analyze`. O SDK 3.6.2 do setup-dart só dá o `lib/` que o nosso
  # lado carrega. Critério: placar completo (código 0: oráculo em dia, nenhum
  # código de `verificados.txt` divergindo) e relatório idêntico com 1, 4 e 8
  # trabalhadores. O placar em si (acertos, FP, FN por código) é trabalho em
  # andamento e não reprova.
  analise:
    name: análise (paridade com o dart analyze)
    needs: compilar
    if: contains(fromJSON('["todos","analise"]'), needs.compilar.outputs.suite)
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/dart
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: binarios
          path: ${{ github.workspace }}
      - name: dartforge-paridade determinismo --trabalhadores 1,4,8
        id: rodar
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'analise'
          New-Item -ItemType Directory -Force $dir | Out-Null
          $rel = Join-Path $dir 'relatorio.txt'
          $inicio = Get-Date
          $p = Start-Process -FilePath target/release/dartforge-paridade.exe -ArgumentList 'determinismo --trabalhadores 1,4,8 --detalhes' `
            -RedirectStandardOutput $rel -RedirectStandardError (Join-Path $dir 'progresso.txt') -NoNewWindow -PassThru -Wait
          $codigo = $p.ExitCode
          $dur = (Get-Date) - $inicio
          $tempo = '{0} min {1:D2} s' -f [int][math]::Floor($dur.TotalMinutes), $dur.Seconds
          $texto = Get-Content $rel -Encoding utf8
          $linha = $texto | Where-Object { $_ -match '^placar paridade: ' } | Select-Object -First 1
          $det = $texto | Where-Object { $_ -match '^determinismo: ' } | Select-Object -First 1
          $tabela = $texto | Where-Object { $_ -notmatch '^\s+\[' }
          $md = @('### Paridade com o dart analyze (corpus/diagnosticos)', '', "$det", '', '```text') + $tabela + @('```', '', "Código de saída: $codigo. Tempo: $tempo.")
          Add-Content $env:GITHUB_STEP_SUMMARY ($md -join "`n") -Encoding utf8
          Write-Host ($texto -join "`n")
          Write-Host "::notice title=Placar analise::$linha; $det ($tempo)"
          "dir=$dir" >> $env:GITHUB_OUTPUT
          exit $codigo
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always() && steps.rodar.outputs.dir != ''
        with:
          name: relatorio-analise
          path: ${{ steps.rodar.outputs.dir }}
          retention-days: 14


  # Portão de TEMPO da regra de custo zero (PLANO.md, "geração de código e
  # macros: rápidas, e custo zero para quem não usa"): com o motor de build
  # compilado dentro, o corpus JS inteiro e a edição de corpo numa sessão
  # sintética de ~300 bibliotecas (projetos sem builders) não podem ficar mais
  # lentos que no main. Compila os dois (commit e main) e mede em 5 rodadas
  # alternadas; reprova se a mediana do commit passar a do main + 3%
  # (scripts/custo-zero.ps1). O portão estrutural (nenhum motor construído,
  # alocações iguais por edição) é o crates/dev/tests/custo_zero.rs, no ci.yml.
  custo-zero:
    name: custo zero (tempo)
    needs: compilar
    if: contains(fromJSON('["todos","custo-zero"]'), needs.compilar.outputs.suite)
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          path: base
      - uses: ./.github/actions/dart
        with:
          gerar-dart-sdk-js: 'true'
      - name: Rust fixado (rust-toolchain.toml)
        run: rustup toolchain install 1.98.1 --profile minimal
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: custo-zero
          workspaces: |
            . -> target
            base -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Compilar o commit e o main (dartforge + exemplo medir)
        shell: pwsh
        env:
          CARGO_PROFILE_RELEASE_LTO: 'false'
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '16'
        # Dois comandos por árvore: `--example` restringe os alvos de todos os
        # pacotes pedidos, e o binário `dartforge` ficaria de fora.
        run: |
          cargo build --locked --release -p dartforge-cli
          if ($LASTEXITCODE -ne 0) { throw 'build do commit falhou' }
          cargo build --locked --release -p dartforge-dev --example medir
          if ($LASTEXITCODE -ne 0) { throw 'build do commit falhou' }
          New-Item -ItemType Directory -Force bin-atual, bin-base | Out-Null
          Copy-Item target/release/dartforge.exe, target/release/examples/medir.exe bin-atual
          Push-Location base
          cargo build --locked --release -p dartforge-cli
          if ($LASTEXITCODE -ne 0) { Pop-Location; throw 'build do main falhou' }
          cargo build --locked --release -p dartforge-dev --example medir
          if ($LASTEXITCODE -ne 0) { Pop-Location; throw 'build do main falhou' }
          Pop-Location
          Copy-Item base/target/release/dartforge.exe, base/target/release/examples/medir.exe bin-base
      - name: Medir (5 rodadas alternadas)
        shell: pwsh
        run: |
          $env:DARTFORGE_DART_SDK_JS = Join-Path $PWD 'runtime/ddc/dart_sdk.js'
          pwsh scripts/custo-zero.ps1 -Atual bin-atual -Base bin-base -Rodadas 5 -Tolerancia 0.10
