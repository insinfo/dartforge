# Diagnóstico temporário (apagar depois): roda testes escolhidos do
# emit_native no macOS arm64 com --nocapture e backtrace, para ver a
# mensagem que o job normal não mostra.
name: Diagnóstico macOS
on:
  workflow_dispatch:
    inputs:
      filtro:
        description: filtro dos testes de `cargo test -p dartforge-emit-native --lib`
        default: sdk_modulo::testes
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_RELEASE_LTO: 'false'
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '16'
  MACOSX_DEPLOYMENT_TARGET: '11.0'
jobs:
  testes:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/dart
      - uses: ./.github/actions/llvm-unix
      - name: Rust fixado (rust-toolchain.toml)
        run: rustup toolchain install 1.98.1 --profile minimal
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: ci-unix
          save-if: false
      - name: Testes com saída
        env:
          RUST_BACKTRACE: '1'
          DARTFORGE_TEST_SDK_LIB: ${{ env.DARTFORGE_SDK_LIB }}
          FILTRO: ${{ inputs.filtro }}
        run: cargo test --locked --release -p dartforge-emit-native --lib "$FILTRO" -- --include-ignored --nocapture --test-threads 1
