name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Install pinned Rust
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Native LLVM toolchain
        run: clang --version
      - run: cargo test --locked --workspace -- --include-ignored
      - name: Documentação Rust em português
        env:
          RUSTDOCFLAGS: '-D warnings'
        run: cargo doc --locked --workspace --no-deps --document-private-items
      - run: cargo build --locked --workspace --release
  conformance:
    name: Dart 3.6.2 differential tests
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1
        with:
          sdk: '3.6.2'
      - name: Install pinned Rust
        run: rustup toolchain install 1.98.1 --profile minimal
      - name: Compare with dart2js O2
        shell: pwsh
        run: ./scripts/conformance.ps1
      - name: Compare constant folding with dart2js O2
        shell: pwsh
        run: ./scripts/conformance.ps1 -DartForgeOptimize
      - name: Compare LLVM O0/O2 with Dart VM and AOT
        shell: pwsh
        run: ./scripts/conformance-native.ps1
