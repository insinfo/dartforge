# CI rápido: todo push no main e nas branches ci/**, e todo pull request.
# O que é pesado (corpus diferencial JS, produção, nativo, determinismo) está em
# pesado.yml. Ver ESTADO.md §3.
#
# O que ficou de fora, e por quê (medido no runner em 2026-09-23; ESTADO.md §1.6):
#   * `cargo fmt --check`: o workspace nunca foi formatado inteiro, e formatá-lo
#     agora conflitaria com todas as branches em andamento. Volta num commit SÓ
#     de formatação, depois que essas branches entrarem.
#   * `cargo clippy -D warnings`: o workspace não está limpo (o primeiro crate,
#     dartforge-elements, já para com 3 erros; emit_js, emit_native e
#     gerador_ng têm avisos do próprio rustc). Volta junto com o fmt, pelo
#     mesmo motivo.
#   * a trilha velha (ESTADO.md §4) e o JIT desligado: 16 testes não ignorados
#     falham em dartforge-compiler, -lexer, -llvm e -cranelift-jit, e esses
#     crates saem quando o backend nativo novo os substituir. Nenhum crate da
#     trilha nova depende deles.
#   * Ubuntu: a trilha nova falha no Linux em dartforge-dev (hashes, plato),
#     dartforge-emit-js (basico) e dartforge-elements (sdk_cache) — não no
#     Windows, que é o alvo. Registrado para quem cuidar do Linux.
#   * o job `conformance` (scripts/conformance*.ps1, dart2js O2) era da trilha
#     velha; a verificação da trilha nova é crates/diferencial, no pesado.yml.
name: CI
on:
  push:
    branches: [main, 'ci/**']
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  # A trilha nova: todo o workspace menos a trilha velha e o JIT.
  FORA: >-
    --exclude dartforge-lexer --exclude dartforge-syntax --exclude dartforge-parser
    --exclude dartforge-semantic --exclude dartforge-hir --exclude dartforge-codegen
    --exclude dartforge-linker --exclude dartforge-optimizer --exclude dartforge-packages
    --exclude dartforge-compiler --exclude dartforge-macros --exclude dartforge-llvm
    --exclude dartforge-jit --exclude dartforge-cranelift-jit
jobs:
  windows:
    name: test e doc (Windows)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
      # SDK 3.6.2: os testes que leem o SDK recebem o caminho por
      # DARTFORGE_SDK_LIB / SdkLayout::discover (a ação exporta os dois).
      - uses: ./.github/actions/dart
        with:
          gerar-dart-sdk-js: 'true'
      # Clang 22.1.8 para os testes que compilam IR (abi, native).
      - uses: ./.github/actions/llvm-windows
      - name: Rust fixado (rust-toolchain.toml)
        run: rustup toolchain install 1.98.1 --profile minimal
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: ci-windows
          # Só o main grava: as branches ci/** restauram o cache do main e não
          # multiplicam entradas (10 GB por repositório).
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: test (trilha nova)
        run: cargo test --locked --workspace $env:FORA.Split(' ') --no-fail-fast
      # Os #[ignore] da trilha nova que o runner consegue satisfazer: SDK Dart,
      # Clang e rustc. Ficam de fora, pelo nome:
      #   corpus_pub*       references/pub é baixado pelo proprietário, fora do git
      #   new_sali_tipa     projeto privado do proprietário (C:/MyDartProjects)
      #   corpus_roda_no_dart_run, ddc_bate_com_dart_run
      #                     o corpus diferencial inteiro — é o pesado.yml
      #   microbenchmark    medição de desempenho do heap, não correção
      #   real_executable_prints_ints_and_bools
      #                     FALHA REAL, registrada (ESTADO.md §1.6): o driver
      #                     antigo `dartforge_native::build_executable` compila o
      #                     runtime como binário, e o runtime agora define
      #                     `extern "C" fn main() -> i32` (rustc E0277). O backend
      #                     nativo novo liga pelo emit_native e não passa por ali.
      - name: test (ignorados que o runner satisfaz)
        if: success() || failure()
        run: >-
          cargo test --locked --workspace $env:FORA.Split(' ') --tests --no-fail-fast --
          --ignored --skip corpus_pub --skip new_sali_tipa --skip corpus_roda_no_dart_run
          --skip ddc_bate_com_dart_run --skip microbenchmark --skip real_executable_prints_ints_and_bools
      # `private_intra_doc_links` fica permitido: com --document-private-items
      # os itens privados SÃO documentados e os links resolvem (o frontend
      # tem 13 desses, todos para métodos privados do Parser).
      - name: doc (trilha nova)
        if: success() || failure()
        env:
          RUSTDOCFLAGS: '-D warnings -A rustdoc::private_intra_doc_links'
        # --keep-going: um crate que falha não esconde os erros dos outros.
        run: cargo doc --locked --workspace $env:FORA.Split(' ') --no-deps --document-private-items --keep-going
