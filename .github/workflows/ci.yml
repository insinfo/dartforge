# CI rápido: todo push no main e nas branches ci/**, e todo pull request.
# O que é pesado (corpus diferencial JS, produção, nativo, determinismo) está em
# pesado.yml. Ver ESTADO.md §3.
#
# O que ficou de fora, e por quê (medido no runner em 2026-09-23; ESTADO.md §1.6):
#   * `cargo fmt --check`: o workspace nunca foi formatado inteiro, e formatá-lo
#     agora conflitaria com todas as branches em andamento. Volta num commit SÓ
#     de formatação, depois que essas branches entrarem.
#   * `cargo clippy -D warnings`: o workspace não está limpo (o primeiro crate,
#     dartforge-elements, já para com 3 erros; emit_js, emit_native e
#     gerador_ng têm avisos do próprio rustc). Volta junto com o fmt, pelo
#     mesmo motivo.
#   * Ubuntu: a trilha nova falha no Linux em dartforge-dev (hashes, plato),
#     dartforge-emit-js (basico) e dartforge-elements (sdk_cache) — não no
#     Windows, que é o alvo. Registrado para quem cuidar do Linux.
#
# A trilha velha e o cranelift-jit saíram do workspace (preservados na branch
# `exploracao-inicial`); o CI testa o workspace inteiro, sem exclusões.
name: CI
on:
  push:
    branches: [main, 'ci/**']
  pull_request:
  # Para rodar numa branch de trabalho sem abrir pull request.
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
jobs:
  # Nenhum commit com trailer de assistente de IA (CONTRIBUTING.md, "Commits").
  mensagens:
    name: mensagens de commit sem trailer de IA
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - run: sh scripts/sem-trailer-ia.sh --historico HEAD

  windows:
    name: test e doc (Windows)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
      # SDK 3.6.2: os testes que leem o SDK recebem o caminho por
      # DARTFORGE_SDK_LIB / SdkLayout::discover (a ação exporta os dois).
      - uses: ./.github/actions/dart
        with:
          gerar-dart-sdk-js: 'true'
      # O corpus do ngdart (crates/gerador_ng/tests/corpus.rs) carrega o ngdart
      # e o ngforms pelo .dart_tool/package_config.json, que fica fora do git.
      # Sem ele o teste falha de propósito (antes, degradava em silêncio e só
      # o caso que exige uma recusa específica acusava).
      - name: pub get do corpus do ngdart
        working-directory: corpus/ngdart
        run: dart pub get
      # Clang 22.1.8 para os testes que compilam IR (abi, emit_native, jit).
      # `desenvolvimento`: llvm-config, LLVM-C.dll/.lib e os cabeçalhos da API C
      # para o llvm-sys do crates/jit (~73 MB a mais no cache).
      - uses: ./.github/actions/llvm-windows
        with:
          desenvolvimento: 'true'
      - name: Rust fixado (rust-toolchain.toml)
        run: rustup toolchain install 1.98.1 --profile minimal
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: ci-windows
          # Só o main grava: as branches ci/** restauram o cache do main e não
          # multiplicam entradas (10 GB por repositório).
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Todos os alvos: lib, bins, testes, exemplos (só compilados) e doctests.
      # Os exemplos de memória têm nomes distintos por crate (memoria_<crate>):
      # com o mesmo nome, o cargo ligava os quatro no mesmo examples/memoria.exe
      # (LNK1104 quando duas ligações se cruzavam).
      - name: test
        run: cargo test --locked --workspace --no-fail-fast
      # O teste de recarga pela CLI é gated por `--features jit`; o workspace
      # padrão compila o binário sem LLVM-C e não executa esta fixture.
      - name: recarga JIT com estado pela CLI
        if: success() || failure()
        run: cargo test --locked -p dartforge-cli --features jit --test reload_estado
      # Os #[ignore] que o runner consegue satisfazer: SDK Dart,
      # Clang e rustc. Ficam de fora, pelo nome:
      #   corpus_pub*       references/pub é baixado pelo proprietário, fora do git
      #   new_sali_tipa     projeto privado do proprietário (C:/MyDartProjects)
      #   corpus_roda_no_dart_run, ddc_bate_com_dart_run
      #                     o corpus diferencial inteiro — é o pesado.yml
      #   microbenchmark    medição de desempenho do heap, não correção
      # Os corpora do motor de build (corpus/builders, oráculo do build_runner
      # oficial), das macros (corpus/macros, o package:json) e do ngdart
      # precisam do package_config.json de cada caso:
      # `pub get` com o lock commitado (versões fixadas). Os testes
      # #[ignore] do crates/build (plano, placar, determinismo, incremental,
      # transparência do ngdart) rodam no passo seguinte.
      - name: pub get dos corpora do motor de build
        if: success() || failure()
        shell: pwsh
        run: |
          $casos = @(Get-ChildItem corpus/builders, corpus/macros -Directory | Where-Object { Test-Path (Join-Path $_.FullName 'pubspec.lock') }) + @(Get-Item corpus/ngdart)
          foreach ($c in $casos) {
            Push-Location $c.FullName
            dart pub get --enforce-lockfile | Out-Null
            if ($LASTEXITCODE -ne 0) { Pop-Location; throw "pub get falhou em $($c.Name)" }
            Pop-Location
          }
          Write-Host "$($casos.Count) casos com package_config.json"
      - name: descoberta de macros pelo build_runner
        if: success() || failure()
        shell: pwsh
        run: ./scripts/testar-macros-builder.ps1
      - name: montagem Dart das augmentations
        if: success() || failure()
        shell: pwsh
        run: |
          Push-Location pacotes/macros
          try {
            dart pub get
            if ($LASTEXITCODE -ne 0) { throw 'pub get da API de macros falhou' }
            dart run test/montagem.dart
            if ($LASTEXITCODE -ne 0) { throw 'montagem Dart das augmentations falhou' }
            dart run test/montagem_cfe.dart
            if ($LASTEXITCODE -ne 0) { throw 'montagem Dart divergiu do CFE' }
            dart --enable-experiment=macros run test/executor_cfe.dart
            if ($LASTEXITCODE -ne 0) { throw 'executor Dart no mesmo isolate divergiu do CFE' }
            dart --enable-experiment=macros run test/builder_model_cfe.dart
            if ($LASTEXITCODE -ne 0) { throw 'modelo do analyzer não reproduziu a fase de declarações CFE' }
          }
          finally { Pop-Location }
      - name: test (ignorados que o runner satisfaz)
        if: success() || failure()
        run: >-
          cargo test --locked --workspace --tests --no-fail-fast --
          --ignored --skip corpus_pub --skip new_sali_tipa --skip corpus_roda_no_dart_run
          --skip ddc_bate_com_dart_run --skip microbenchmark
      # `private_intra_doc_links` fica permitido: com --document-private-items
      # os itens privados SÃO documentados e os links resolvem (o frontend
      # tem 13 desses, todos para métodos privados do Parser).
      - name: doc
        if: success() || failure()
        env:
          RUSTDOCFLAGS: '-D warnings -A rustdoc::private_intra_doc_links'
        # --keep-going: um crate que falha não esconde os erros dos outros.
        run: cargo doc --locked --workspace --no-deps --document-private-items --keep-going

  # O backend nativo e o JIT no Linux e no macOS: compilar com os dois
  # features, os testes do emit_native e do JIT (com os ignorados) e a recarga
  # pela CLI. O corpus inteiro fica no job `nativo-unix` do pesado.yml.
  # O Linux usa a libLLVM-22.so do apt.llvm.org com DARTFORGE_LLVM_LINK=shared
  # (o caminho dinâmico do crates/jit/build.rs); o macOS, o pacote oficial
  # arm64 em `auto` (estático: o pacote não traz a biblioteca compartilhada).
  nativo-unix:
    name: nativo e jit (${{ matrix.nome }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            nome: Linux, libLLVM compartilhada
          - os: macos-latest
            nome: macOS arm64
    env:
      CARGO_PROFILE_RELEASE_LTO: 'false'
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '16'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/dart
      - name: LLVM 22 do apt.llvm.org (libLLVM-22.so)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc >/dev/null
          . /etc/os-release
          echo "deb http://apt.llvm.org/$VERSION_CODENAME/ llvm-toolchain-$VERSION_CODENAME-22 main" | sudo tee /etc/apt/sources.list.d/llvm-22.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang-22 lld-22 llvm-22-dev libpolly-22-dev libzstd-dev
          prefixo=/usr/lib/llvm-22
          ls "$prefixo"/lib/libLLVM*.so*
          echo "DARTFORGE_CLANG=$prefixo/bin/clang" >> "$GITHUB_ENV"
          echo "DARTFORGE_LLVM_DIR=$prefixo" >> "$GITHUB_ENV"
          echo "LLVM_SYS_221_PREFIX=$prefixo" >> "$GITHUB_ENV"
          echo "DARTFORGE_LLVM_LINK=shared" >> "$GITHUB_ENV"
      - if: runner.os == 'macOS'
        uses: ./.github/actions/llvm-unix
      - name: Rust fixado (rust-toolchain.toml)
        run: rustup toolchain install 1.98.1 --profile minimal
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: ci-unix
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Compilar dartforge (nativo, jit)
        run: cargo build --locked --release -p dartforge-cli --features nativo,jit -p dartforge-jit
      - name: Testes do emit_native (com os ignorados)
        env:
          DARTFORGE_TEST_SDK_LIB: ${{ env.DARTFORGE_SDK_LIB }}
        run: cargo test --locked --release -p dartforge-emit-native -- --include-ignored
      - name: Testes do JIT (com os ignorados)
        run: cargo test --locked --release -p dartforge-jit -- --include-ignored
      - name: Recarga JIT da CLI (com e sem o SDK da fonte)
        run: cargo test --locked --release -p dartforge-cli --features nativo,jit --test reload_estado -- --include-ignored
      - name: Olá, mundo — AOT de desenvolvimento, produção e JIT
        shell: bash
        env:
          DARTFORGE_SDK_DA_FONTE: '1'
        run: |
          set -euo pipefail
          d=$(mktemp -d)
          printf "void main() {\n  print('oi');\n  print([1, 2, 3].map((x) => x * 2).toList());\n}\n" > "$d/main.dart"
          esperado=$'oi\n[2, 4, 6]'
          ./target/release/dartforge compile-native "$d/main.dart" -o "$d/dev"
          [ "$("$d/dev")" = "$esperado" ]
          ./target/release/dartforge aot "$d/main.dart" "$d/prod" --optimize
          [ "$("$d/prod")" = "$esperado" ]
          [ "$(./target/release/dartforge run "$d/main.dart")" = "$esperado" ]
