# Release: a `v*` tag publishes the dartforge distribution (`dartforge
# pack`) for Windows x64, Linux x64 and macOS arm64 as a GitHub release.
# Each archive carries the executable, the runtime, the Dart SDK (lib/), the
# linker and the sysroot: whoever downloads it installs no Rust, LLVM, Dart
# SDK, MSVC/Windows SDK or Xcode (docs/NATIVO.md §1.2).
#
# Before publishing, each job checks the distribution in a clean environment:
# it compiles and runs a program in development and production AOT.
# A tag with a hyphen (v0.1.0-alpha.1) becomes a pre-release.
name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: existing tag to (re)publish
        required: true
permissions:
  contents: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: '0'
  TAG: ${{ inputs.tag || github.ref_name }}
jobs:
  create:
    name: create the release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Prepare a draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then exit 0; fi
          pre=()
          case "$TAG" in *-*) pre=(--prerelease) ;; esac
          gh release create "$TAG" "${pre[@]}" --draft --verify-tag --title "DartForge $TAG" --notes-file - <<'EOF'
          Experimental build of DartForge, a Dart → JavaScript and native (LLVM) compiler written in Rust.

          Each archive is a self-contained distribution: `bin/dartforge` plus the runtime, the Dart SDK
          libraries, the linker and the system stubs. No Rust, LLVM, Dart SDK, MSVC/Windows SDK or
          Xcode is needed on the machine that uses it.

              dartforge aot main.dart main --optimize     # native executable
              dartforge run main.dart                      # JIT, with hot reload
              dartforge compile-js main.dart -o dist       # JavaScript (DDC contract)

          Status and known gaps: see ESTADO.md and docs/PENDENCIAS.md in the repository.
          EOF

  package:
    name: package (${{ matrix.name }})
    needs: create
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x64
          - os: ubuntu-latest
            name: linux-x64
          - os: macos-latest
            name: macos-arm64
    env:
      # The C that `cc` compiles comes out with the arm64 target's minimum (ci.yml).
      MACOSX_DEPLOYMENT_TARGET: '11.0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.TAG }}
      - uses: ./.github/actions/dart
      - if: runner.os == 'Windows'
        uses: ./.github/actions/llvm-windows
        with:
          development: 'true'
      # Linux and macOS: the official LLVM package, linked statically (the
      # published executable does not depend on an installed libLLVM).
      - if: runner.os != 'Windows'
        uses: ./.github/actions/llvm-unix
      - name: Pinned Rust (rust-toolchain.toml)
        run: rustup toolchain install 1.98.1 --profile minimal
      - name: Build dartforge (native, jit)
        run: cargo build --locked --release -p dartforge-cli --features native,jit
      - name: Pack and check in a clean environment
        shell: bash
        env:
          NAME: ${{ matrix.name }}
        run: |
          set -euo pipefail
          root=$(mktemp -d)
          dist="$root/dartforge-$TAG-$NAME"
          exe=dartforge; [ "$RUNNER_OS" = Windows ] && exe=dartforge.exe
          "./target/release/$exe" pack "$dist"
          du -sh "$dist"
          d=$(mktemp -d)
          printf "void main(List<String> a) {\n  print('hi \${a.join(\",\")}');\n  print([1, 2, 3].map((x) => x * x).toList());\n}\n" > "$d/main.dart"
          expected=$'hi x,y\n[1, 4, 9]'
          cd "$d"
          if [ "$RUNNER_OS" = Windows ]; then
            "$dist/bin/$exe" aot main.dart dev.exe
            [ "$(./dev.exe x y | tr -d '\r')" = "$expected" ]
            "$dist/bin/$exe" aot main.dart prod.exe --optimize
            [ "$(./prod.exe x y | tr -d '\r')" = "$expected" ]
          else
            env -i PATH=/usr/bin:/bin HOME="$d/home" "$dist/bin/$exe" aot main.dart dev
            [ "$(./dev x y)" = "$expected" ]
            env -i PATH=/usr/bin:/bin HOME="$d/home" "$dist/bin/$exe" aot main.dart prod --optimize
            [ "$(./prod x y)" = "$expected" ]
          fi
          echo "DIST=$dist" >> "$GITHUB_ENV"
          echo "ROOT=$root" >> "$GITHUB_ENV"
      # In the same shell as the previous step: the paths it recorded are
      # bash's (/tmp/... on Windows), which pwsh does not resolve.
      - name: Compress (.zip on Windows, .tar.gz elsewhere)
        shell: bash
        run: |
          set -euo pipefail
          name=$(basename "$DIST")
          cd "$ROOT"
          if [ "$RUNNER_OS" = Windows ]; then
            7z a -tzip -bso0 "$name.zip" "$name"
            echo "ARCHIVE=$ROOT/$name.zip" >> "$GITHUB_ENV"
          else
            tar -czf "$name.tar.gz" "$name"
            echo "ARCHIVE=$ROOT/$name.tar.gz" >> "$GITHUB_ENV"
          fi
      - name: Publish to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" "$ARCHIVE" --clobber

  publish:
    name: publish the validated release
    needs: [create, package]
    runs-on: ubuntu-latest
    steps:
      - name: Publish after all platform packages pass
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release edit "$TAG" --draft=false
