name: Dart SDK 3.6.2 (and 3.13.4)
description: >
  Installs the Dart SDK 3.6.2 (dart-lang/setup-dart) and exports its path in
  the variables the project reads: DARTFORGE_DART_SDK (differential harness),
  DARTFORGE_SDK_LIB and DART_SDK (SdkLayout::discover, tests).
  With generate-dart-sdk-js, generates runtime/ddc/dart_sdk.js (outside git).
  With sdk-313, also installs the SDK 3.13.4 — the oracle of the 3.7–3.13
  features (docs/VERSOES-LINGUAGEM.md §5) — and exports DARTFORGE_DART_SDK_3_13.

# 3.6.2 comes without a cache: setup-dart downloads the SDK zip from
# storage.googleapis.com in a few seconds, and the version is fixed. 3.13.4
# comes as a zip, outside PATH (the `dart` on PATH stays 3.6.2, which is the
# floor), and cached by version.

inputs:
  generate-dart-sdk-js:
    description: Generate runtime/ddc/dart_sdk.js with scripts/generate-dart-sdk.ps1
    default: 'false'
  sdk-313:
    description: Also install the SDK 3.13.4 and export DARTFORGE_DART_SDK_3_13
    default: 'false'

runs:
  using: composite
  steps:
    - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1
      with:
        sdk: '3.6.2'
        # setup-dart's problem matcher is looked up relative to the directory
        # of the action that calls it — inside a composite action, this
        # directory, where the JSON does not exist, and the step fails. We do
        # not use `dart analyze`.
        problem-matcher: false

    - name: Export the SDK path
      shell: pwsh
      run: |
        # The executable is at <sdk>/bin/dart(.exe); the root is two levels up.
        $dart = (Get-Command dart).Source
        $sdk = Split-Path (Split-Path $dart -Parent) -Parent
        & $dart --version
        if (!(Test-Path (Join-Path $sdk 'lib/libraries.json'))) { throw "SDK without lib/libraries.json at $sdk" }
        "DARTFORGE_DART_SDK=$sdk" >> $env:GITHUB_ENV
        "DARTFORGE_SDK_LIB=$(Join-Path $sdk 'lib')" >> $env:GITHUB_ENV
        "DART_SDK=$sdk" >> $env:GITHUB_ENV
        Write-Host "Dart SDK at $sdk"

    - name: Generate runtime/ddc/dart_sdk.js
      if: inputs.generate-dart-sdk-js == 'true'
      shell: pwsh
      run: pwsh scripts/generate-dart-sdk.ps1 -Sdk $env:DARTFORGE_DART_SDK

    - name: SDK 3.13.4 (cache)
      if: inputs.sdk-313 == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: ${{ runner.temp }}/dart-3.13.4
        key: dart-sdk-3.13.4-${{ runner.os }}

    - name: SDK 3.13.4 (zip)
      if: inputs.sdk-313 == 'true'
      shell: pwsh
      run: |
        $dir = Join-Path $env:RUNNER_TEMP 'dart-3.13.4'
        $sdk = Join-Path $dir 'dart-sdk'
        if (!(Test-Path (Join-Path $sdk 'version'))) {
          New-Item -ItemType Directory -Force $dir | Out-Null
          $zip = Join-Path $env:RUNNER_TEMP 'dart-3.13.4.zip'
          Invoke-WebRequest -Uri 'https://storage.googleapis.com/dart-archive/channels/stable/release/3.13.4/sdk/dartsdk-windows-x64-release.zip' -OutFile $zip
          Expand-Archive $zip -DestinationPath $dir
          Remove-Item $zip
        }
        $version = (Get-Content (Join-Path $sdk 'version')).Trim()
        if ($version -ne '3.13.4') { throw "SDK 3.13.4 expected at $sdk, got $version" }
        & (Join-Path $sdk 'bin/dart.exe') --version
        "DARTFORGE_DART_SDK_3_13=$sdk" >> $env:GITHUB_ENV
        Write-Host "Dart SDK 3.13.4 at $sdk"
