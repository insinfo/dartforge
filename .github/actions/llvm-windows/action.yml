name: LLVM 22.1.8 (Windows)
description: >
  Instala a MESMA versão de LLVM usada localmente (22.1.8) a partir do pacote
  oficial clang+llvm-22.1.8-x86_64-pc-windows-msvc e exporta DARTFORGE_CLANG
  (e põe o clang no PATH). Com `desenvolvimento: 'true'`, traz também o que o
  llvm-sys do crates/jit precisa e exporta LLVM_SYS_221_PREFIX.

# Por que a mesma versão e não o LLVM que já vem no runner: o backend nativo
# emite LLVM IR TEXTUAL, e o formato textual muda entre versões — um Clang de
# outra versão pode recusar (ou aceitar diferente) o que o nosso emissor gera.
#
# O Clang e o lld-link precisam ser da mesma versão para ThinLTO do SDK da
# fonte: o bitcode 22 é recusado pelo lld-link 20 presente no runner.
# Extrai-se `bin/clang*.exe` porque o pacote pode guardar os executáveis
# irmãos como hardlinks de um deles, e extrair um hardlink sem o alvo falha;
# os irmãos do Clang (~100 MB cada) são apagados em seguida. Os executáveis
# irmãos do lld são mantidos porque lld-link pode ser um hardlink de lld.exe.
#
# `desenvolvimento` acrescenta só o recorte mínimo do JIT (crates/jit, ORCv2),
# medido localmente em ~73 MB. São cinco peças:
#   bin/llvm-config.exe     (0,6 MB) o build.rs do llvm-sys o exige
#   bin/LLVM-C.dll          (72 MB)  a ligação do JIT é dinâmica (docs/JIT.md)
#   lib/LLVM-C.lib          (0,3 MB) import library da DLL
#   include/llvm-c/         (0,5 MB) cabeçalhos da API C
#   include/llvm/Config/    (44 KB)  incluídos por llvm-c/Target.h (wrapper do llvm-sys)
# O recorte antigo de 1,1 GB levava as bibliotecas estáticas, que o JIT não usa
# (CRT estática, ver crates/jit/build.rs).
#
# O pacote inteiro tem 862 MB comprimidos; cada recorte cabe num cache pequeno,
# com chave fixa pela versão e pelo recorte (não muda com o código).

inputs:
  desenvolvimento:
    description: "'true' para trazer também llvm-config, LLVM-C e cabeçalhos (crates/jit)"
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - id: cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: C:\llvm-22.1.8
        key: llvm-22.1.8-windows-x64-${{ inputs.desenvolvimento == 'true' && 'dev-v2' || 'clang-v3' }}

    - name: Baixar e extrair o LLVM 22.1.8
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        DESENVOLVIMENTO: ${{ inputs.desenvolvimento }}
      run: |
        set -euo pipefail
        raiz=clang+llvm-22.1.8-x86_64-pc-windows-msvc
        url="https://github.com/llvm/llvm-project/releases/download/llvmorg-22.1.8/$raiz.tar.xz"
        # Caminho POSIX: o GNU tar lê `D:\a\...` como "host D, arquivo remoto".
        pacote="$(cygpath -u "$RUNNER_TEMP")/llvm.tar.xz"
        inicio=$SECONDS
        curl -fsSL --retry 3 -o "$pacote" "$url"
        echo "download: $((SECONDS - inicio)) s"
        mkdir -p /c/llvm-22.1.8
        padroes=("$raiz/bin/clang*.exe" "$raiz/bin/lld*.exe" "$raiz/bin/ld.lld.exe" "$raiz/bin/ld64.lld.exe")
        if [ "$DESENVOLVIMENTO" = "true" ]; then
          padroes+=("$raiz/bin/llvm-config.exe" "$raiz/bin/LLVM-C.dll" "$raiz/lib/LLVM-C.lib"
                    "$raiz/include/llvm-c/*" "$raiz/include/llvm/Config/*")
        fi
        # O tar do Git Bash é o GNU tar, que chama `xz` para -J; se o xz não
        # estiver no PATH, o 7-Zip do runner descomprime para o pipe.
        if command -v xz >/dev/null; then
          tar -xJf "$pacote" -C /c/llvm-22.1.8 --strip-components=1 --wildcards "${padroes[@]}"
        else
          7z x -so "$pacote" | tar -xf - -C /c/llvm-22.1.8 --strip-components=1 --wildcards "${padroes[@]}"
        fi
        rm -f "$pacote"
        find /c/llvm-22.1.8/bin -type f -name 'clang*.exe' ! -name clang.exe -delete
        echo "extração: $((SECONDS - inicio)) s no total"
        du -sh /c/llvm-22.1.8 /c/llvm-22.1.8/*

    - name: Exportar o LLVM para os passos seguintes
      shell: pwsh
      env:
        DESENVOLVIMENTO: ${{ inputs.desenvolvimento }}
      run: |
        $raiz = 'C:\llvm-22.1.8'
        $versao = & "$raiz\bin\clang.exe" --version | Select-Object -First 1
        Write-Host $versao
        if ($versao -notmatch '22\.1\.8') { throw "Clang inesperado: $versao" }
        $ligador = & "$raiz\bin\lld-link.exe" --version | Select-Object -First 1
        Write-Host $ligador
        if ($ligador -notmatch '22\.1\.8') { throw "lld-link inesperado: $ligador" }
        "DARTFORGE_CLANG=$raiz\bin\clang.exe" >> $env:GITHUB_ENV
        "$raiz\bin" >> $env:GITHUB_PATH
        if ($env:DESENVOLVIMENTO -eq 'true') {
          $config = & "$raiz\bin\llvm-config.exe" --version
          Write-Host "llvm-config $config"
          if ($config -notmatch '22\.1\.8') { throw "llvm-config inesperado: $config" }
          # Tem precedência sobre o [env] de .cargo/config.toml, que aponta
          # para a instalação da máquina do proprietário.
          "LLVM_SYS_221_PREFIX=$raiz" >> $env:GITHUB_ENV
        }
