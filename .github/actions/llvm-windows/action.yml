name: LLVM 22.1.8 (Windows)
description: >
  Instala a MESMA versão de LLVM usada localmente (22.1.8) a partir do pacote
  oficial clang+llvm-22.1.8-x86_64-pc-windows-msvc, só com o clang.exe,
  e exporta DARTFORGE_CLANG (e põe o clang no PATH).

# Por que a mesma versão e não o LLVM que já vem no runner: o backend nativo
# emite LLVM IR TEXTUAL, e o formato textual muda entre versões — um Clang de
# outra versão pode recusar (ou aceitar diferente) o que o nosso emissor gera.
#
# Só o clang.exe é guardado: é o que o backend nativo usa (IR -> objeto ->
# ligação pelo link.exe do MSVC) e o que os testes nativos chamam. Extrai-se
# `bin/clang*.exe` porque o pacote pode guardar os executáveis irmãos como
# hardlinks de um deles, e extrair um hardlink sem o alvo falha; os irmãos
# (~100 MB cada) são apagados em seguida. O recorte anterior, com
# llvm-config, LLVM-C e os cabeçalhos para o llvm-sys do crates/jit (trilha
# velha, fora do CI), ocupava 1,1 GB extraído e 358 MiB de cache.
#
# O pacote inteiro tem 862 MB comprimidos; o recorte cabe num cache pequeno,
# com chave fixa pela versão (não muda com o código).

runs:
  using: composite
  steps:
    - id: cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: C:\llvm-22.1.8
        key: llvm-22.1.8-windows-x64-clang-v2

    - name: Baixar e extrair o LLVM 22.1.8
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        set -euo pipefail
        raiz=clang+llvm-22.1.8-x86_64-pc-windows-msvc
        url="https://github.com/llvm/llvm-project/releases/download/llvmorg-22.1.8/$raiz.tar.xz"
        # Caminho POSIX: o GNU tar lê `D:\a\...` como "host D, arquivo remoto".
        pacote="$(cygpath -u "$RUNNER_TEMP")/llvm.tar.xz"
        inicio=$SECONDS
        curl -fsSL --retry 3 -o "$pacote" "$url"
        echo "download: $((SECONDS - inicio)) s"
        mkdir -p /c/llvm-22.1.8
        # O tar do Git Bash é o GNU tar, que chama `xz` para -J; se o xz não
        # estiver no PATH, o 7-Zip do runner descomprime para o pipe.
        if command -v xz >/dev/null; then
          tar -xJf "$pacote" -C /c/llvm-22.1.8 --strip-components=1 --wildcards "$raiz/bin/clang*.exe"
        else
          7z x -so "$pacote" | tar -xf - -C /c/llvm-22.1.8 --strip-components=1 --wildcards "$raiz/bin/clang*.exe"
        fi
        rm -f "$pacote"
        find /c/llvm-22.1.8/bin -type f ! -name clang.exe -delete
        echo "extração: $((SECONDS - inicio)) s no total"
        du -sh /c/llvm-22.1.8 /c/llvm-22.1.8/*

    - name: Exportar o LLVM para os passos seguintes
      shell: pwsh
      run: |
        $raiz = 'C:\llvm-22.1.8'
        $versao = & "$raiz\bin\clang.exe" --version | Select-Object -First 1
        Write-Host $versao
        if ($versao -notmatch '22\.1\.8') { throw "Clang inesperado: $versao" }
        "DARTFORGE_CLANG=$raiz\bin\clang.exe" >> $env:GITHUB_ENV
        "$raiz\bin" >> $env:GITHUB_PATH
