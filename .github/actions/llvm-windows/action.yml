name: LLVM 22.1.8 (Windows)
description: >
  Installs the SAME LLVM version used locally (22.1.8) from the official
  clang+llvm-22.1.8-x86_64-pc-windows-msvc package and exports DARTFORGE_CLANG
  (and puts clang on PATH). With `development: 'true'`, it also brings what
  crates/jit's llvm-sys needs and exports LLVM_SYS_221_PREFIX.

# Why the same version and not the LLVM that comes with the runner: the native
# backend emits TEXTUAL LLVM IR, and the textual format changes between
# versions — a Clang of another version may reject (or accept differently)
# what our emitter generates.
#
# Clang and lld-link have to be of the same version for the source SDK's
# ThinLTO: version 22 bitcode is rejected by the runner's lld-link 20.
# `bin/clang*.exe` is extracted because the package may store the sibling
# executables as hardlinks of one of them, and extracting a hardlink without
# its target fails; Clang's siblings (~100 MB each) are deleted right after.
# lld's sibling executables are kept because lld-link may be a hardlink of
# lld.exe.
#
# `development` adds only the slice of the JIT (crates/jit, ORCv2):
#   bin/llvm-config.exe     (0.6 MB) llvm-sys's build.rs requires it
#   bin/LLVM-C.dll          (72 MB)  the JIT links dynamically (docs/JIT.md)
#   lib/LLVM-C.lib          (0.3 MB) the DLL's import library
#   include/llvm-c/         (0.5 MB) C API headers
#   include/llvm/           the C++ headers: crates/jit/build.rs compiles the
#                           COFF bridge (src/coff_layer.cpp) against ORC's
#                           RTDyldObjectLinkingLayer.h, which also needs Config/
#   bin/clang-cl.exe, bin/llvm-lib.exe  that build.rs compiles and archives the
#                           bridge with them
# The old 1.1 GB slice took the static libraries, which the JIT does not use
# (static CRT, see crates/llvm/build.rs).
#
# The whole package is 862 MB compressed; each slice fits a small cache, with
# a key fixed by the version and the slice (it does not change with the code).

inputs:
  development:
    description: "'true' to also bring llvm-config, LLVM-C and headers (crates/jit)"
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - id: cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: C:\llvm-22.1.8
        key: llvm-22.1.8-windows-x64-${{ inputs.development == 'true' && 'dev-v3' || 'clang-v3' }}

    - name: Download and extract LLVM 22.1.8
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        DEVELOPMENT: ${{ inputs.development }}
      run: |
        set -euo pipefail
        root=clang+llvm-22.1.8-x86_64-pc-windows-msvc
        url="https://github.com/llvm/llvm-project/releases/download/llvmorg-22.1.8/$root.tar.xz"
        # POSIX path: GNU tar reads `D:\a\...` as "host D, remote file".
        package="$(cygpath -u "$RUNNER_TEMP")/llvm.tar.xz"
        start=$SECONDS
        curl -fsSL --retry 3 -o "$package" "$url"
        echo "download: $((SECONDS - start)) s"
        mkdir -p /c/llvm-22.1.8
        patterns=("$root/bin/clang*.exe" "$root/bin/lld*.exe" "$root/bin/ld.lld.exe" "$root/bin/ld64.lld.exe")
        if [ "$DEVELOPMENT" = "true" ]; then
          patterns+=("$root/bin/llvm-config.exe" "$root/bin/LLVM-C.dll" "$root/lib/LLVM-C.lib"
                    "$root/bin/llvm-lib.exe" "$root/include/llvm-c/*" "$root/include/llvm/*")
        fi
        # Git Bash's tar is GNU tar, which calls `xz` for -J; if xz is not on
        # PATH, the runner's 7-Zip decompresses into the pipe.
        if command -v xz >/dev/null; then
          tar -xJf "$package" -C /c/llvm-22.1.8 --strip-components=1 --wildcards "${patterns[@]}"
        else
          7z x -so "$package" | tar -xf - -C /c/llvm-22.1.8 --strip-components=1 --wildcards "${patterns[@]}"
        fi
        rm -f "$package"
        # The JIT's COFF bridge (crates/jit/build.rs) compiles with clang-cl.
        if [ "$DEVELOPMENT" = "true" ]; then
          find /c/llvm-22.1.8/bin -type f -name 'clang*.exe' ! -name clang.exe ! -name clang-cl.exe -delete
        else
          find /c/llvm-22.1.8/bin -type f -name 'clang*.exe' ! -name clang.exe -delete
        fi
        echo "extraction: $((SECONDS - start)) s in total"
        du -sh /c/llvm-22.1.8 /c/llvm-22.1.8/*

    - name: Export LLVM to the following steps
      shell: pwsh
      env:
        DEVELOPMENT: ${{ inputs.development }}
      run: |
        $root = 'C:\llvm-22.1.8'
        $version = & "$root\bin\clang.exe" --version | Select-Object -First 1
        Write-Host $version
        if ($version -notmatch '22\.1\.8') { throw "unexpected Clang: $version" }
        $linker = & "$root\bin\lld-link.exe" --version | Select-Object -First 1
        Write-Host $linker
        if ($linker -notmatch '22\.1\.8') { throw "unexpected lld-link: $linker" }
        "DARTFORGE_CLANG=$root\bin\clang.exe" >> $env:GITHUB_ENV
        "$root\bin" >> $env:GITHUB_PATH
        if ($env:DEVELOPMENT -eq 'true') {
          $config = & "$root\bin\llvm-config.exe" --version
          Write-Host "llvm-config $config"
          if ($config -notmatch '22\.1\.8') { throw "unexpected llvm-config: $config" }
          # Takes precedence over .cargo/config.toml's [env], which points
          # to the installation on the owner's machine.
          "LLVM_SYS_221_PREFIX=$root" >> $env:GITHUB_ENV
        }
