name: LLVM 22.1.8 (Linux and macOS)
description: >
  Installs the SAME LLVM version as Windows (22.1.8) from the official package
  of the runner's system (LLVM-22.1.8-Linux-X64 or LLVM-22.1.8-macOS-ARM64) and
  exports DARTFORGE_CLANG, DARTFORGE_LLVM_DIR and LLVM_SYS_221_PREFIX.

# The extracted slice is what the native backend and the JIT use:
#   bin/clang*, bin/lld*, bin/ld.lld, bin/ld64.lld  compile the IR and link (ThinLTO)
#   bin/llvm-config                                llvm-sys's and crates/jit's build.rs
#   lib/libLLVM*.a                                 the JIT links statically with this package
#   lib/clang/                                     Clang's resources (on macOS, the
#                                                  libclang_rt.osx.a the link asks for)
#   include/llvm-c/, include/llvm/Config/          C API headers (llvm-sys)
# The Linux X64 package does not carry the shared libLLVM (checked); if the macOS
# one does, it is not extracted here, and `auto` links statically on both. apt.llvm.org
# carries the shared one (the `native-unix` job of ci.yml). See docs/JIT.md, «Linux e macOS».

runs:
  using: composite
  steps:
    - id: name
      shell: bash
      run: |
        case "$RUNNER_OS-$RUNNER_ARCH" in
          Linux-X64) echo "package=LLVM-22.1.8-Linux-X64" >> "$GITHUB_OUTPUT" ;;
          Linux-ARM64) echo "package=LLVM-22.1.8-Linux-ARM64" >> "$GITHUB_OUTPUT" ;;
          macOS-ARM64) echo "package=LLVM-22.1.8-macOS-ARM64" >> "$GITHUB_OUTPUT" ;;
          *) echo "::error::no official LLVM 22.1.8 package for $RUNNER_OS-$RUNNER_ARCH"; exit 1 ;;
        esac

    - id: cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: ${{ runner.temp }}/llvm-22.1.8
        key: ${{ steps.name.outputs.package }}-v1

    - name: Download and extract LLVM 22.1.8
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        PACKAGE: ${{ steps.name.outputs.package }}
      run: |
        set -euo pipefail
        url="https://github.com/llvm/llvm-project/releases/download/llvmorg-22.1.8/$PACKAGE.tar.xz"
        archive="$RUNNER_TEMP/llvm.tar.xz"
        destination="$RUNNER_TEMP/llvm-22.1.8"
        start=$SECONDS
        curl -fsSL --retry 3 -o "$archive" "$url"
        echo "download: $((SECONDS - start)) s"
        mkdir -p "$destination"
        patterns=("$PACKAGE/bin/clang*" "$PACKAGE/bin/lld*" "$PACKAGE/bin/ld.lld" "$PACKAGE/bin/ld64.lld"
                 "$PACKAGE/bin/llvm-config" "$PACKAGE/lib/libLLVM*.a" "$PACKAGE/lib/clang/*"
                 "$PACKAGE/include/llvm-c/*" "$PACKAGE/include/llvm/Config/*")
        # macOS's tar is bsdtar, without --wildcards (the patterns are already globs there).
        if tar --version 2>/dev/null | grep -q GNU; then
          tar -xJf "$archive" -C "$destination" --strip-components=1 --wildcards "${patterns[@]}"
        else
          tar -xJf "$archive" -C "$destination" --strip-components=1 "${patterns[@]}"
        fi
        rm -f "$archive"
        echo "extraction: $((SECONDS - start)) s in total"
        du -sh "$destination" "$destination"/*

    - name: Export LLVM to the following steps
      shell: bash
      run: |
        set -euo pipefail
        prefix="$RUNNER_TEMP/llvm-22.1.8"
        "$prefix/bin/clang" --version
        echo "DARTFORGE_CLANG=$prefix/bin/clang" >> "$GITHUB_ENV"
        echo "DARTFORGE_LLVM_DIR=$prefix" >> "$GITHUB_ENV"
        echo "LLVM_SYS_221_PREFIX=$prefix" >> "$GITHUB_ENV"
        echo "$prefix/bin" >> "$GITHUB_PATH"
        # The repository's macOS Cargo linker inspects LLVM archives and
        # selects matching LLD and a compatible SDK only when bitcode needs it.
        # Do not override that selection with job-wide linker/rustdoc flags.

    - name: Check macOS Cargo linker selection
      if: runner.os == 'macOS'
      shell: bash
      run: python3 -m unittest discover -s scripts -p 'test_*macos*.py' -v
