name: Differential harness
description: >
  Prepares the run environment (Node, Dart SDK, binaries from the `build`
  job, oracle cache; for native also Rust and LLVM), runs
  `dartforge-differential` with the given arguments, publishes the scoreboard
  to $GITHUB_STEP_SUMMARY and to an annotation, and uploads the report as an
  artifact.

# Assumes the checkout is already done (the action is local) and the
# `binaries` artifact of the `build` job of this same run.
#
# Harness exit code (crates/differential/src/main.rs): 0 = all match;
# 1 = some program fails (complete report, scoreboard below the total);
# 2 = invalid argument or empty corpus; 101 = harness panic.
# `accept-partial-scoreboard: true` accepts 1 — that is the case of native,
# which is work in progress: the job only fails if the harness breaks (a code
# outside {0,1}, or a report without the scoreboard line).

inputs:
  name:
    description: Job identifier (name of the report-<name> artifact)
    required: true
  title:
    description: Title of the scoreboard in the summary
    required: true
  args:
    description: dartforge-differential arguments
    required: true
  native:
    description: Install Rust (native runtime) and LLVM 22.1.8 (Clang)
    default: 'false'
  jit:
    description: Also bring LLVM's development slice (LLVM-C.dll on PATH) for the JIT executor
    default: 'false'
  accept-partial-scoreboard:
    description: Exit code 1 (scoreboard below the total) does not fail the job
    default: 'false'
  requires:
    description: Regex the report must contain to count as a valid report
    default: '^DartForge '
  sdk-313:
    description: Also install the 3.13.4 oracle SDK (corpus/modern)
    default: 'false'
  pub-get:
    description: Directory whose subdirectories with pubspec.lock get `dart pub get --enforce-lockfile` before the harness (corpus/macros)
    default: ''
  prepare:
    description: Optional script that prepares a DartForge input before the harness
    default: ''

runs:
  using: composite
  steps:
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
      with:
        node-version: '24'
    - uses: ./.github/actions/dart
      with:
        sdk-313: ${{ inputs.sdk-313 }}
    - name: Pinned Rust (native runtime compiled by rustc)
      if: inputs.native == 'true'
      shell: pwsh
      run: rustup toolchain install 1.98.1 --profile minimal
    - if: inputs.native == 'true'
      uses: ./.github/actions/llvm-windows
      with:
        development: ${{ inputs.jit }}
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
      with:
        name: binaries
        path: ${{ github.workspace }}
    # The precompiled runtime the `build` job put in the artifact: dartforge
    # looks for it in DARTFORGE_LIB (its build's OUT_DIR did not come along).
    - name: Precompiled runtime (DARTFORGE_LIB)
      if: inputs.native == 'true'
      shell: pwsh
      run: |
        $d = Join-Path $env:GITHUB_WORKSPACE 'runtime-pre'
        if (!(Get-ChildItem $d -Filter 'dartforge_runtime_*.lib' -EA SilentlyContinue)) { Write-Host '::error::the binaries artifact did not bring the precompiled runtime'; exit 1 }
        "DARTFORGE_LIB=$d" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
    - name: Oracles (cache saved by the build job)
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: target/differential/cache
        key: oracles-${{ runner.os }}-dart3.6.2-${{ hashFiles('corpus/js/**') }}

    - name: pub get (${{ inputs.pub-get }})
      if: inputs.pub-get != ''
      shell: pwsh
      env:
        ROOT: ${{ inputs.pub-get }}
      run: |
        $cases = @(Get-ChildItem $env:ROOT -Directory | Where-Object { Test-Path (Join-Path $_.FullName 'pubspec.lock') })
        foreach ($c in $cases) {
          Push-Location $c.FullName
          dart pub get --enforce-lockfile | Out-Null
          if ($LASTEXITCODE -ne 0) { Pop-Location; throw "pub get failed in $($c.Name)" }
          Pop-Location
        }
        Write-Host "$($cases.Count) cases with package_config.json"
    - name: Prepare the corpus's DartForge input
      if: inputs.prepare != ''
      shell: pwsh
      env:
        PREPARE_SCRIPT: ${{ inputs.prepare }}
      run: |
        & $env:PREPARE_SCRIPT
        if ($LASTEXITCODE -ne 0) { throw "corpus preparation failed: $env:PREPARE_SCRIPT" }

    - name: dartforge-differential ${{ inputs.args }}
      id: run
      shell: pwsh
      env:
        HARNESS_ARGS: ${{ inputs.args }}
        NAME: ${{ inputs.name }}
      run: |
        $dir = Join-Path $env:RUNNER_TEMP "harness-$env:NAME"
        New-Item -ItemType Directory -Force $dir | Out-Null
        $rel = Join-Path $dir 'report.txt'
        $prog = Join-Path $dir 'progress.txt'
        $exe = Join-Path $env:GITHUB_WORKSPACE 'target\release\dartforge-differential.exe'
        "dir=$dir" >> $env:GITHUB_OUTPUT
        Write-Host "$exe $env:HARNESS_ARGS"
        # Start-Process writes stdout/stderr byte for byte (the report is UTF-8)
        # and lets this loop measure free memory while the harness runs.
        $os = Get-CimInstance Win32_OperatingSystem
        $totalGb = $os.TotalVisibleMemorySize / 1MB
        $minFree = $os.FreePhysicalMemory / 1MB
        $start = Get-Date
        $p = Start-Process -FilePath $exe -ArgumentList $env:HARNESS_ARGS -WorkingDirectory $env:GITHUB_WORKSPACE `
          -RedirectStandardOutput $rel -RedirectStandardError $prog -NoNewWindow -PassThru
        $null = $p.Handle  # without this the ExitCode comes back empty after the process ends
        $reader = $null
        function Drain {
          if (!$script:reader -and (Test-Path $prog)) {
            $fs = [IO.FileStream]::new($prog, 'Open', 'Read', 'ReadWrite, Delete')
            $script:reader = [IO.StreamReader]::new($fs, [Text.Encoding]::UTF8)
          }
          if ($script:reader) { while ($null -ne ($l = $script:reader.ReadLine())) { Write-Host $l } }
        }
        while (!$p.HasExited) {
          $free = (Get-CimInstance Win32_OperatingSystem).FreePhysicalMemory / 1MB
          if ($free -lt $minFree) { $minFree = $free }
          Drain
          Start-Sleep -Seconds 5
        }
        $p.WaitForExit()
        Drain
        $code = $p.ExitCode
        $dur = (Get-Date) - $start
        $time = '{0} min {1:D2} s' -f [int][math]::Floor($dur.TotalMinutes), $dur.Seconds
        $mem = [string]::Format([Globalization.CultureInfo]::InvariantCulture, '{0:F1} of {1:F1} GB', $minFree, $totalGb)
        Write-Host "exit code: $code; time: $time; minimum free memory: $mem"
        "code=$code" >> $env:GITHUB_OUTPUT
        "time=$time" >> $env:GITHUB_OUTPUT
        "memory=$mem" >> $env:GITHUB_OUTPUT
        Write-Host '--- report ---'
        if (Test-Path $rel) { Get-Content $rel -Encoding utf8 | Write-Host }
        exit 0

    - name: Scoreboard in the summary
      if: always() && steps.run.outputs.dir != ''
      shell: pwsh
      env:
        DIR: ${{ steps.run.outputs.dir }}
        TITLE: ${{ inputs.title }}
        NAME: ${{ inputs.name }}
        CODE: ${{ steps.run.outputs.code }}
        TIME: ${{ steps.run.outputs.time }}
        MEMORY: ${{ steps.run.outputs.memory }}
      run: |
        $rel = Join-Path $env:DIR 'report.txt'
        $prog = Join-Path $env:DIR 'progress.txt'
        $md = Join-Path $env:DIR 'scoreboard.md'
        $text = if (Test-Path $rel) { Get-Content $rel -Encoding utf8 } else { @() }
        if ($text -match '^determinism( \(IR\))?: ') {
          # Determinism mode has no scoreboard: it says whether the N passes matched.
          $lines = @("### $env:TITLE", '', '```text')
          $lines += $text | Where-Object { $_ -match '^determinism( \(IR\))?: |^\d+ programs: ' }
          if (Test-Path $prog) { $lines += Get-Content $prog -Encoding utf8 | Where-Object { $_ -match 'worker|line \d+:|^\s+[ab]: |warning' } }
          $lines += '```'
          $body = $lines -join "`n"
          $one = ($text | Where-Object { $_ -match '^determinism( \(IR\))?: ' } | Select-Object -First 1)
        } else {
          $body = & "$env:GITHUB_WORKSPACE/scripts/ci-scoreboard.ps1" -Report $rel -Title $env:TITLE
          $one = & "$env:GITHUB_WORKSPACE/scripts/ci-scoreboard.ps1" -Report $rel -Line
        }
        $body += "`n`nHarness exit code: $env:CODE. Harness time on the runner: $env:TIME. Minimum free memory: $env:MEMORY.`n"
        Set-Content -Path $md -Value $body -Encoding utf8
        Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value $body -Encoding utf8
        # The annotation shows up in `gh run view` and is what `scripts/ci.ps1 -List` reads.
        Write-Host "::notice title=Scoreboard $env:NAME::$one ($env:TIME)"

    - name: Report as an artifact
      if: always() && steps.run.outputs.dir != ''
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: report-${{ inputs.name }}
        path: ${{ steps.run.outputs.dir }}
        retention-days: 14

    - name: Verdict
      shell: pwsh
      env:
        DIR: ${{ steps.run.outputs.dir }}
        CODE: ${{ steps.run.outputs.code }}
        PARTIAL: ${{ inputs.accept-partial-scoreboard }}
        REQUIRES: ${{ inputs.requires }}
      run: |
        $rel = Join-Path $env:DIR 'report.txt'
        $valid = (Test-Path $rel) -and ((Get-Content $rel -Encoding utf8) -match $env:REQUIRES)
        if (!$valid) { Write-Host "::error::the harness did not write a valid report (code $env:CODE)"; exit 1 }
        if ($env:CODE -eq '0') { exit 0 }
        if ($env:CODE -eq '1' -and $env:PARTIAL -eq 'true') {
          Write-Host 'scoreboard below the total — accepted in this job (work in progress)'
          exit 0
        }
        Write-Host "::error::dartforge-differential exited with code $env:CODE"
        exit 1
